<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fennick · Unfold</title>
<style>
  html, body { margin: 0; height: 100%; background: #f1ebe0; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
<canvas id="c" width="1440" height="1440"></canvas>
<script src="kit.js"></script>
<script>
// Unfold: a frame-locked remake of the grammar of @twoclipping's keynote-style
// launch film (see ../spec.md), filled with Fennick, a fictional sparkling-tea
// company made for omnigami's examples (cast/fennick). One continuous take: every
// scene is made out of the previous one. Nothing fades, blurs or cuts; shapes
// change instead. A screen-studio camera frames each moment; a cursor drives it.
// The screens are Fennick's real shop, captured by plans/; the tiles are its can
// renders and photographs. Square, wide and tall: one design, laid out for each frame.
(() => {
  const { clamp, lerp, spring, track, loadFont, loadImage, measure, roundRect, drawCover, easeOutExpo, easeInOutCubic, rng } = window.kit;
  const W = 1440, H = 1440, CX = 720, CY = 720, FPS = 60, DURATION = 27;
  const canvas = document.getElementById('c');
  const g = canvas.getContext('2d', { willReadFrequently: true });
  const helper = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d', { willReadFrequently: true })]; };
  const [paperC, PL] = helper(W, H);      // the ribbon wallpaper behind the phone and window

  // ---------- type ----------
  const BR = (s, w = 800) => `semi-condensed ${w} ${s}px Bricolage`; // Fennick's display face: heavy, a little condensed
  const DM = (s, w = 500) => `${w} ${s}px DM Sans`;
  const INK = '#1D1A16', CANVAS = '#F1EBE0', PAPER = '#FBF6EE', MUTED = '#6E665C';
  // Fennick's palette (cast/fennick/brand.md): a colour for each flavour, and fizz
  const FL = { yuzu: '#F7CC33', hibiscus: '#DB3863', pear: '#8CC261', fizz: '#FF6A3D' };

  // ---------- the words: named fields ----------
  const DEFAULTS = { wordmark: 'Fennick', tagline: 'Tea, but it fizzes.', cta: 'Build your box', verb: 'fill' };
  const FIELDS = [
    { id: 'wordmark', type: 'text', label: 'Wordmark', maxLength: 9, help: 'The brand name. The film adds the period it squeezes into.' },
    { id: 'tagline', type: 'text', label: 'Tagline', maxLength: 40 },
    { id: 'cta', type: 'text', label: 'Pill label', maxLength: 16, help: 'The first click: the main call to action.' },
    { id: 'verb', type: 'text', label: 'Glass word', maxLength: 7, help: 'One verb, popped in glass over the product. The film adds the period.' },
  ];
  let V = DEFAULTS;
  let S; // the current shape's layout (see SHAPES), set from seek's arguments on every frame

  // ---------- small helpers ----------
  const ease = (t, a, b, f = easeInOutCubic) => f(clamp((t - a) / (b - a)));
  const inCubic = (p) => p * p * p;
  const sp = (t, t0, k = 170, d = 26) => spring(t - t0, k, d);
  function text(c, s, x, y, font, col, align = 'left', base = 'middle') { c.font = font; c.fillStyle = col; c.textAlign = align; if (base === 'middle') window.kit.centreText(c, s, x, y); else { c.textBaseline = base; c.fillText(s, x, y); } } // 'middle': centred on the capitals
  // glass: a smoky ink tint, a white veil, a top highlight and a bright rim
  function glass(c, path, alpha = 1, tint = 0.5) {
    c.save(); c.globalAlpha = alpha;
    path(); c.fillStyle = `rgba(29,26,22,${tint})`; c.fill();
    path(); c.fillStyle = 'rgba(255,255,255,0.11)'; c.fill();
    c.lineWidth = 2.5; c.strokeStyle = 'rgba(255,255,255,0.62)'; c.stroke();
    c.restore();
  }
  // a round aperture: black outside a circle of radius open × R; open = 1 shows everything
  function iris(c, cx, cy, R, open) {
    if (open >= 0.999) return;
    c.save(); c.beginPath(); c.rect(cx - R * 2, cy - R * 2, R * 4, R * 4); c.arc(cx, cy, Math.max(0, open) * R, 0, Math.PI * 2);
    c.fillStyle = INK; c.fill('evenodd'); c.restore();
  }
  // a press: 0 → 1 over the 0.07 s before a click lands at tc, back to 0 over the 0.22 s after
  const press = (t, tc) => (t < tc - 0.07 ? 0 : t < tc ? easeOutExpo((t - tc + 0.07) / 0.07) : 1 - easeInOutCubic(clamp((t - tc) / 0.22)));
  // around (x, y), scale by k: a pressed thing sinks a little
  const sink = (c, x, y, k) => { c.translate(x, y); c.scale(k, k); c.translate(-x, -y); };

  // ---------- the wordmark, and the period it squeezes into ----------
  let WM = null;
  function wordmark(c) {
    const word = V.wordmark + '.', B = S.wm;
    if (WM && WM.word === word && WM.shape === S.name) return WM;
    let size = B.max; c.font = BR(100); const w100 = c.measureText(word).width; size = Math.min(B.max, (B.fit * 100) / w100);
    c.font = BR(size); const total = c.measureText(word).width, x0 = S.cx - total / 2, base = B.base;
    const chars = []; let acc = 0;
    for (const ch of word) { const w = c.measureText(ch).width; chars.push({ ch, x: x0 + acc, w }); acc = c.measureText(word.slice(0, chars.length)).width; }
    const dot = chars[chars.length - 1], m = c.measureText('.');
    const dl = dot.x - m.actualBoundingBoxLeft, dr = dot.x + m.actualBoundingBoxRight, dd = dr - dl;
    WM = { word, shape: S.name, size, base, chars, dotX: dot.x, dotCx: (dl + dr) / 2, dotCy: base - m.actualBoundingBoxAscent / 2 + m.actualBoundingBoxDescent / 2, dotD: dd };
    return WM;
  }
  // the letters drop out of sight through a mask line just under the wordmark, left to right, leaving
  // the period (0.5–0.85), and rise back through it at the close (25.35). drop(i) → 0 at rest, 1 gone.
  function drawWord(c, drop) {
    const L = wordmark(c), n = L.chars.length - 1, fall = L.size * 1.1;
    c.font = BR(L.size); c.fillStyle = INK; c.textBaseline = 'alphabetic'; c.textAlign = 'left';
    c.save(); c.beginPath(); c.rect(-2000, -4000, 8000, 4000 + L.base + L.size * 0.24); c.clip(); // room for descenders
    L.chars.slice(0, -1).forEach((ch, i) => { const d = drop(i, n); if (d < 0.999) c.fillText(ch.ch, ch.x, L.base + d * fall); });
    c.restore();
    c.beginPath(); c.arc(L.dotCx, L.dotCy, L.dotD / 2, 0, Math.PI * 2); c.fill();
  }
  const wordOut = (t) => (i) => inCubic(clamp((t - 0.5 - i * 0.03) / 0.2));
  const wordIn = (t) => (i, n) => 1 - easeOutExpo(clamp((t - 25.35 - (n - 1 - i) * 0.035) / 0.45));
  // the tagline: drops out of its mask line, later rises back into it
  function drawTagline(c, t) {
    const B = S.wm, y = B.tagY, font = DM(B.tag, 400); c.font = font;
    const s = V.tagline, total = measure(c, font, s); let x = S.cx - total / 2;
    c.save(); c.beginPath(); c.rect(0, 0, S.dw, y + 24); c.clip();
    c.fillStyle = MUTED; c.textBaseline = 'alphabetic'; c.textAlign = 'left'; const yb = window.kit.capMiddle(c, y) - y;
    [...s].forEach((ch, i) => {
      const drop = t < 13 ? inCubic(clamp((t - 0.42 - i * 0.004) / 0.1)) : 1 - easeOutExpo(clamp((t - 25.9 - i * 0.006) / 0.3));
      if (drop < 0.999) c.fillText(ch, x, yb + y + drop * B.drop);
      x += measure(c, font, ch);
    });
    c.restore();
  }

  // ---------- the art and the shop's screens (loaded in prepare) ----------
  // ART: Fennick's can renders and photographs (cast/fennick/app/art). SCR: its real shop, captured by
  // plans/desktop.json (1440 × 1000 CSS px at 3×) and plans/mobile.json (390 × 844 at 4×): the home page,
  // the home page without its hero picture, and the box page with 0 … 12 cans. The rects (CSS px) are
  // copied from each folder's screens.json: the hero picture and its button, the box, and the full
  // box's checkout button. `order`: the order shape's [t, w, h] keys (CSS px); `u`: its text size.
  const ART = {};
  // the phone (a photograph of an unbranded phone, its screen cut out: PHONE_SCREEN is the screen's
  // rect in its pixels), the owner's lock-screen wallpaper, and the box arrived, for the last shot
  const ART_EXTRA = { phone: 'phone.png', wallpaper: 'wallpaper.jpg', arrival: 'arrival-tall.jpg', arrivalWide: 'arrival-wide.jpg' };
  const PHONE_SCREEN = [25, 26, 490, 1118];
  const SCR = {
    d: { dir: 'assets/screens', scale: 3, w: 1440, img: {}, heroPic: [706.38, 120, 669.63, 780], heroBtn: [64, 653.72, 233.22, 64], stage: [64, 152, 732.66, 725.53], go: [100, 789.53, 660.66, 56],
      order: [[19.7, 660.66, 56], [20.02, 300, 52], [20.47, 300, 52], [20.95, 300, 70], [21.36, 52, 52]], u: 18 },
    m: { dir: 'assets/screens-mobile', scale: 4, w: 390, img: {}, heroPic: [24, 509.66, 342, 348.97], heroBtn: [24, 412.66, 342, 64], stage: [24, 287.86, 342, 203.44], go: [167.91, 499.3, 198.09, 40],
      order: [[19.7, 198.09, 40], [20.02, 200, 44], [20.47, 200, 44], [20.95, 200, 60], [21.36, 44, 44]], u: 14, // no wider than the button: the page's margin is close
      paper: 'rgb(252,246,239)', extra: ['checkout', 'order'],
      // the full box's summary row (box-11's old row leaves the band; "Box ready" and the button arrive)
      row: { band: [494, 543], old: [0, 500, 390, 32], shift: 0, ready: [0, 497, 166, 46], btn: [167.91, 499.3, 198.09, 40] },
      // the checkout page (1891 tall): its "Start my box" button; the order page (844 tall)
      checkout: { h: 1891, place: [24, 1510.81, 342, 64] } },
  };
  const SHOTS = ['home', 'home-bare', ...Array.from({ length: 13 }, (_, i) => `box-${String(i).padStart(2, '0')}`)];
  // a region of a capture (CSS px), drawn into a box
  function shot(c, D, name, [sx, sy, sw, sh], x, y, w, h) { const k = D.scale; c.drawImage(D.img[name], sx * k, sy * k, sw * k, sh * k, x, y, w, h); }

  // ---------- tiles: Fennick's cans and photographs where the original has photos (1000-unit squares) ----------
  const TILE = {};
  // a can standing on its flavour's colour
  const canTile = (bg, art) => (c) => {
    c.fillStyle = bg; c.fillRect(0, 0, 1000, 1000);
    const gl = c.createRadialGradient(500, 330, 0, 500, 330, 700); gl.addColorStop(0, 'rgba(255,255,255,0.3)'); gl.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = gl; c.fillRect(0, 0, 1000, 1000);
    c.save(); c.translate(500, 928); c.scale(1, 0.14); const sh = c.createRadialGradient(0, 0, 0, 0, 0, 230); sh.addColorStop(0, 'rgba(29,26,22,0.3)'); sh.addColorStop(1, 'rgba(29,26,22,0)'); c.fillStyle = sh; c.fillRect(-300, -300, 600, 600); c.restore();
    const img = ART[art], h = 880, w = h * img.width / img.height; c.drawImage(img, 500 - w / 2, 930 - h * 0.972, w, h);
  };
  TILE.yuzu = canTile(FL.yuzu, 'can-yuzu'); // the first thing the iris opens onto
  TILE.hibiscus = canTile(FL.hibiscus, 'can-hibiscus');
  TILE.pear = canTile(FL.pear, 'can-pear');
  TILE.serving = (c) => drawCover(c, ART.serving, 0, 0, 1000, 1000, [0.45, 0.5]);
  TILE.brewing = (c) => drawCover(c, ART.brewing, 0, 0, 1000, 1000, [0.42, 0.45]);
  TILE.trio = (c) => drawCover(c, ART.condensation, 0, 0, 1000, 1000, [0.5, 0.55]);
  TILE.box = (c) => { c.fillStyle = '#EFE6D6'; c.fillRect(0, 0, 1000, 1000); const img = ART.box, s = 880 / img.width; c.drawImage(img, 60, 70, img.width * s, img.height * s); };
  TILE.kcal = (c) => {
    c.fillStyle = FL.fizz; c.fillRect(0, 0, 1000, 1000);
    text(c, '25', 500, 410, BR(480), INK, 'center');
    text(c, 'calories a can', 500, 730, DM(84, 600), INK, 'center');
    text(c, 'No sugar added', 500, 836, DM(66, 500), 'rgba(29,26,22,0.72)', 'center');
  };
  TILE.feed = (c, t) => { c.save(); c.scale(1000 / 1440, 1000 / 1440); feedScreen(c, t); c.restore(); };
  // the 3 × 3 grid: [tile, col, row]; the middle one is the yuzu can, the middle right the box builder
  const GRID = [['hibiscus', 0, 0], ['serving', 1, 0], ['kcal', 2, 0], ['pear', 0, 1], ['yuzu', 1, 1], ['feed', 2, 1], ['brewing', 0, 2], ['trio', 1, 2], ['box', 2, 2]];
  // square's bento: 4 × 3 cells of 224 on a 241 step; the box builder takes 2 × 2 at the top right
  const BENTO = { hibiscus: [0, 0], pear: [0, 1], brewing: [0, 2], serving: [1, 0], kcal: [1, 1], yuzu: [1, 2], trio: [2, 2], box: [3, 2] };
  function drawTile(c, name, x, y, s, r, t) {
    c.save(); roundRect(c, x - s / 2, y - s / 2, s, s, r); c.clip();
    c.translate(x - s / 2, y - s / 2); c.scale(s / 1000, s / 1000); TILE[name](c, t); c.restore();
  }
  // wide and tall: the feed's tile is a w × h screen in the frame's own shape, covered from its top left
  function feedTile(c, x, y, w, h, r, t) {
    c.save(); roundRect(c, x - w / 2, y - h / 2, w, h, r); c.clip();
    const q = Math.max(w / S.dw, h / S.dh); c.translate(x - w / 2, y - h / 2); c.scale(q, q); feedScreen(c, t); c.restore();
  }

  // ---------- the box builder: Fennick's real page, filling as the slider moves ----------
  // the slider's position, 0 … 1 (8.65–9.75); the box holds 12 × that many cans
  const knobAt = (t) => (t < 8.65 ? 0 : t < 9.75 ? lerp(easeInOutCubic(clamp((t - 8.65) / 1.1)), clamp((t - 8.65) / 1.1), 0.3) : 1);
  const cansAt = (t) => Math.round(12 * knobAt(t));
  let FULL = 9.75; for (let f = 8.65; f < 9.76; f += 1 / 240) if (cansAt(f) === 12) { FULL = f; break; } // the twelfth can lands
  // the page fills the frame (S.dw × S.dh): S.feed.crop is the part of the capture (CSS px) it shows
  function feedScreen(c, t) {
    const F = S.feed, D = SCR[F.set], s = S.dw / F.crop[2], img = D.img[`box-${String(cansAt(t)).padStart(2, '0')}`];
    c.fillStyle = PAPER; c.fillRect(-400, -400, S.dw + 800, S.dh + 800);
    c.save(); c.translate(-F.crop[0] * s, -F.crop[1] * s); c.scale(s / D.scale, s / D.scale); c.drawImage(img, 0, 0); c.restore();
    if (D.row && t >= FULL && t < FULL + 0.8) { c.save(); c.translate(-F.crop[0] * s, -F.crop[1] * s); c.scale(s, s); boxReady(c, t - FULL, D); c.restore(); }
    if (D.row && press(t, C.click) > 0) { c.save(); c.translate(-F.crop[0] * s, -F.crop[1] * s); c.scale(s, s); pressedButton(c, D, 'box-12', D.row.btn, press(t, C.click)); c.restore(); }
  }
  // a captured button, pressed: the paper painted over it, the button redrawn a little smaller and
  // lit a touch (CSS px of its capture)
  function pressedButton(c, D, name, [bx, by, bw, bh], pr) {
    const k = D.scale, cx = bx + bw / 2, cy = by + bh / 2;
    c.fillStyle = D.paper; c.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    c.save(); sink(c, cx, cy, 1 - 0.05 * pr); roundRect(c, bx, by, bw, bh, bh / 2); c.clip();
    c.drawImage(D.img[name], bx * k, by * k, bw * k, bh * k, bx, by, bw, bh);
    c.fillStyle = `rgba(255,255,255,${0.14 * pr})`; c.fillRect(bx, by, bw, bh); c.restore();
  }
  // the box fills: the summary row's "11/12 · 1 to go" leaves upward, "Box ready" rises in and the
  // Checkout button opens leftward from its right end (CSS px of the full box's capture)
  function boxReady(c, u, D) {
    const R = D.row, k = D.scale, part = (name, [sx, sy, sw, sh], dx, dy) => c.drawImage(D.img[name], sx * k, sy * k, sw * k, sh * k, sx + dx, sy + dy, sw, sh);
    c.save(); c.beginPath(); c.rect(0, R.band[0], D.w, R.band[1] - R.band[0]); c.clip();
    c.fillStyle = D.paper; c.fillRect(0, R.band[0], D.w, R.band[1] - R.band[0]);
    const out = inCubic(clamp(u / 0.16)); if (out < 1) part('box-11', R.old, 0, R.shift - out * 36);
    const rise = easeOutExpo(clamp((u - 0.08) / 0.4)); part('box-12', R.ready, 0, (1 - rise) * 40);
    const [bx, by, bw, bh] = R.btn, o = spring(u - 0.18, 230, 24), w = lerp(bh, bw, clamp(o, 0, 1.04));
    if (u > 0.18) { c.save(); roundRect(c, bx + bw - w, by, w, bh, bh / 2); c.clip(); part('box-12', R.btn, 0, 0); c.restore(); }
    c.restore();
  }

  // ---------- C: the order on the phone's own pages, then the phone itself (11.5–22.1) ----------
  // The box page pushes off for the checkout (11.5), which scrolls to "Start my box" (12.75) and is
  // clicked (14.25); the order page pushes in (14.6) and holds. The screen pulls back into the phone
  // (15.95), and its lock screen slides down over the page (17.0): Thursday's "shipped" (17.65), the
  // clock rolls on to Saturday (18.8), "delivered" (19.3). A tap (20.85) turns that
  // notification into the delivered dot (20.9), which floods the frame (21.72).
  const C = { click: 11.45, push1: 11.5, scroll: [12.75, 13.75], place: 14.25, push2: 14.6, pull: 15.95, lock: 17.0, n1: 17.65, roll: 18.8, n2: 19.3, tap: 20.85, dot: 20.9, tick: 21.25, ripple: 21.45 };
  const pushAt = (t, t0) => ease(t, t0, t0 + 0.36, (q) => 1 - (1 - q) ** 3);
  // the screen: the whole frame until the pull-back (tall), then the phone's screen (S.ph)
  function screenRect(t) {
    const P = S.ph, p = S.fullScreen ? sp(t, C.pull, 120, 21) : 1;
    return { x: lerp(0, P.x, p), y: lerp(0, P.y, p), w: lerp(S.dw, P.w, p), h: lerp(S.dh, P.h, p), r: lerp(0, P.r, p), p };
  }
  // a captured phone page in the screen, `top` CSS px scrolled, `dx` design units across
  const BAR = 44; // the phone's status bar, CSS px: the page sits under it once the screen is in the phone
  function page(c, R, name, top, dx = 0) { const D = SCR.m, img = D.img[name], u = R.w / D.w, sb = BAR * clamp(R.p); c.drawImage(img, R.x + dx, R.y + (sb - top) * u, img.width * u / D.scale, img.height * u / D.scale); }
  function statusBar(c, R, time) {
    const u = R.w / 390, h = BAR * clamp(R.p) * u; if (h < 1) return;
    c.fillStyle = INK; c.fillRect(R.x, R.y, R.w, h);
    c.save(); c.beginPath(); c.rect(R.x, R.y, R.w, h); c.clip(); c.translate(0, h - BAR * u);
    text(c, time, R.x + 34 * u, R.y + 24 * u, DM(15 * u, 600), '#fff');
    for (let i = 0; i < 4; i++) { const bh = (4 + i * 2.4) * u; roundRect(c, R.x + (300 + i * 5.5) * u, R.y + 29 * u - bh, 3.4 * u, bh, 1 * u); c.fillStyle = '#fff'; c.fill(); }
    roundRect(c, R.x + 330 * u, R.y + 18 * u, 25 * u, 12 * u, 3.5 * u); c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 1.2 * u; c.stroke();
    roundRect(c, R.x + 332 * u, R.y + 20 * u, 18 * u, 8 * u, 2 * u); c.fillStyle = '#fff'; c.fill();
    c.restore();
  }
  function screenContent(c, t, R) {
    const lock = pushAt(t, C.lock);
    if (lock >= 1) { lockScreen(c, t, R, 0); return; }
    const a = pushAt(t, C.push1), b = pushAt(t, C.push2), top = lerp(0, S.placeTop, ease(t, C.scroll[0], C.scroll[1]));
    if (a < 1) { page(c, R, 'box-12', 100, -R.w * a); const pr = press(t, C.click); if (pr > 0) { const u = R.w / 390; c.save(); c.translate(R.x - R.w * a, R.y + (BAR * clamp(R.p) - 100) * u); c.scale(u, u); pressedButton(c, SCR.m, 'box-12', SCR.m.row.btn, pr); c.restore(); } }
    if (a > 0 && b < 1) { const dx = R.w * (1 - a) - R.w * b; page(c, R, 'checkout', top, dx); placeButton(c, t, R, top, dx); }
    if (b > 0) page(c, R, 'order', 100 * (1 - clamp(R.p)), R.w * (1 - b)); // the pull-back shows the page from its top
    statusBar(c, R, '8:12');
    if (lock > 0) lockScreen(c, t, R, -(1 - lock) * R.h); // the lock screen comes down over the page
  }
  // "Start my box": its label leaves upward and a spinner rises in, until the order page arrives
  function placeButton(c, t, R, top, dx) {
    if (t < C.place - 0.07) return;
    const D = SCR.m, [bx, by, bw, bh] = D.checkout.place, u = R.w / D.w, k = D.scale, x = R.x + dx + bx * u, y = R.y + (by - top) * u, w = bw * u, h = bh * u, pr = press(t, C.place);
    const out = inCubic(clamp((t - C.place) / 0.12)), inn = easeOutExpo(clamp((t - C.place - 0.08) / 0.3));
    c.fillStyle = D.paper; c.fillRect(x - 1, y - 1, w + 2, h + 2);
    c.save(); sink(c, x + w / 2, y + h / 2, 1 - 0.05 * pr); roundRect(c, x, y, w, h, h / 2); c.clip(); c.fillStyle = D.ink; c.fillRect(x, y, w, h);
    c.drawImage(D.img.checkout, (bx + bh / 2) * k, by * k, (bw - bh) * k, bh * k, x + h / 2, y - out * h, w - h, h);
    if (t >= C.place) { const a0 = t * 9, cy = y + h / 2 + (1 - inn) * h; c.strokeStyle = '#fff'; c.lineWidth = h * 0.07; c.lineCap = 'round'; c.beginPath(); c.arc(x + w / 2, cy, h * 0.2, a0, a0 + 4.2); c.stroke(); }
