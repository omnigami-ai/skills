<!doctype html>

<canvas id="c" width="1080" height="1920"></canvas>
<footer id="credit" style="position:fixed;bottom:8px;left:12px;right:12px;font:11px/1.4 system-ui;color:#928a7d;text-align:center">
  Fennick is a fictional company made for omnigami’s examples. · <a style="color:inherit" href="https://x.com/justinmfarrugia/status/2103822390870569266" target="_blank" rel="noopener noreferrer">Style inspired by @justinmfarrugia’s video</a>
</footer>
<script src="kit.js"></script>
<script>
// Fennick is a fictional sparkling-tea company made for omnigami's examples.
// KEEP: deterministic canvas toolkit, type fitting, 120 BPM item pushes, pull, counts, orbit and irises.
// ADAPT: brand, six honest beats (three real cans, twice each), captured responsive catalogue and box builder.
// REPLACE: source mark path. Every claim and capture is documented in STORY.md and plans/.
(() => {
  const { clamp, lerp, spring: kitSpring, loadFont, loadImage, roundRect, easeOutExpo, motion: m } = window.kit;
  const FPS = 60, F = 1 / 12, BPM = 120, BEAT = 60 / BPM, BAR = 4 * BEAT, DURATION = 20;
  const at = (bar, beat = 0) => bar * BAR + beat * BEAT; // a time on the beat grid
  // each shape's frame. A phone app shows its phone screens in every shape: whole in tall, a
  // close-up card in square and wide (never a desktop page squeezed into a phone frame)
  const SHAPES = { '9:16': [1080, 1920], '1:1': [1440, 1440], '16:9': [1920, 1080] };
  let W = 1080, H = 1920, U = 10.8, shape = '9:16'; // U: 1% of the frame's short side
  const tall = () => shape === '9:16', wide = () => shape === '16:9';

  const canvas = document.getElementById('c');
  const g = canvas.getContext('2d', { willReadFrequently: true });
  // Font fitting must not change the paint canvas's spacing state on a cache miss.
  const metrics = document.createElement('canvas').getContext('2d', { willReadFrequently: true });


  // ---------- ADAPT: Fennick's own palette and licensed Bricolage / DM Sans ----------
  const CREAM = '#FBF6EE', PAPER = '#FFFCF7', SAND = '#E7DDCD', MOSS = '#1D1A16', DEEP = '#1D1A16', SPROUT = '#F7CC33';
  const TERRA = '#DB3863', AMBER = '#F7CC33', INK = '#1D1A16', MUTED = '#6E665C', TRACK = '#E7DDCD', GHOST = '#BEB09A', PALE = '#E7DDCD';
  const TONES = { due: TERRA, light: AMBER, fine: MOSS };
  const SAGE = '#F1EDDB'; // cream with a breath of sprout: every other item stands on it
  const FIELD = (i) => (i % 2 ? SAGE : CREAM); // the last item must stand on the screen's colour (cream) // the pill's dot: the ring's own meaning
  const SERIF = (w = 800) => (s) => `${w} ${s}px Bricolage`; // brand display family
  const SANS = (w = 600) => (s) => `${w} ${s}px DMSans`;

  // ---------- ADAPT: the words, as named fields (sources in STORY.md) ----------
  const DEFAULTS = {
    brand: 'FENNICK', tagline: 'Sparkling botanical tea. By the box.',
    p1name: 'Yuzu & Fennel', p1kind: 'Bright citrus', p1latin: 'Sparkling green tea', p1care: 'Green sencha · yuzu · fennel seed', p1status: 'Green tea',
    p2name: 'Hibiscus & Blackcurrant', p2kind: 'Deep berry', p2latin: 'Sparkling black tea', p2care: 'Black Assam · hibiscus · blackcurrant', p2status: 'Black tea',
    p3name: 'Pear & Ginger', p3kind: 'Slow warmth', p3latin: 'Sparkling white tea', p3care: 'White tea · pear · fresh ginger', p3status: 'White tea',
    p4name: 'Yuzu & Fennel', p4kind: 'Sencha', p4latin: 'Bright, citrus, an anise finish', p4care: '330 ml · No sugar added', p4status: 'Green tea',
    p5name: 'Hibiscus & Blackcurrant', p5kind: 'Assam', p5latin: 'Tart, deep, berry', p5care: '330 ml · No sugar added', p5status: 'Black tea',
    p6name: 'Pear & Ginger', p6kind: 'White tea', p6latin: 'Soft, warm, a little heat', p6care: '330 ml · No sugar added', p6status: 'White tea',
    n1: '3', n1label: 'tea blends', n2: '25', n2label: 'calories per can', n3: '330', n3label: 'ml in every can',
    headline: 'Tea, but it fizzes.', url: 'fennick.example',
  };
  // Exactly three products, each twice: ingredients first, then tasting notes. Never six flavours.
  const ITEMS = [['can-yuzu','light',1], ['can-hibiscus','due',1], ['can-pear','fine',1], ['can-yuzu','light',1], ['can-hibiscus','due',1], ['can-pear','fine',1]];
  const N = ITEMS.length;
  const FIELDS = [
    { id: 'brand', type: 'text', label: 'Name', maxLength: 14 },
    { id: 'tagline', type: 'text', label: 'Line under the name', maxLength: 48 },
    ...ITEMS.flatMap((_, i) => [
      { id: `p${i + 1}name`, type: 'text', label: `Item ${i + 1}: name`, maxLength: 26 },
      { id: `p${i + 1}kind`, type: 'text', label: `Item ${i + 1}: word behind it`, maxLength: 20, ...(i ? {} : { help: 'Huge and pale behind the item: its kind or category.' }) },
      { id: `p${i + 1}latin`, type: 'text', label: `Item ${i + 1}: small line above`, maxLength: 32 },
      { id: `p${i + 1}care`, type: 'text', label: `Item ${i + 1}: detail line`, maxLength: 40, ...(i ? {} : { help: 'A number in it ticks from one item to the next.' }) },
      { id: `p${i + 1}status`, type: 'text', label: `Item ${i + 1}: pill`, maxLength: 14 },
    ]),
    { id: 'n1', type: 'text', label: 'Number 1', maxLength: 6 }, { id: 'n1label', type: 'text', label: 'Number 1: label', maxLength: 22 },
    { id: 'n2', type: 'text', label: 'Number 2', maxLength: 6 }, { id: 'n2label', type: 'text', label: 'Number 2: label', maxLength: 22 },
    { id: 'n3', type: 'text', label: 'Number 3', maxLength: 6 }, { id: 'n3label', type: 'text', label: 'Number 3: label', maxLength: 22 },
    { id: 'headline', type: 'text', label: 'The line in the orbit', maxLength: 34 },
    { id: 'url', type: 'text', label: 'Address', maxLength: 22 },
  ];
  let V = DEFAULTS; // set from seek's arguments on every frame
  const item = (i) => ({ photo: ITEMS[i][0], tone: ITEMS[i][1], scale: ITEMS[i][2] || 1, name: V[`p${i + 1}name`], kind: V[`p${i + 1}kind`], latin: V[`p${i + 1}latin`], care: V[`p${i + 1}care`], status: V[`p${i + 1}status`] });

  // ADAPT: actual responsive shop captures and DOM rects, never a redrawn UI.
  const ORBIT = ['can-yuzu','can-hibiscus','can-pear','cans-trio','box','brewing','serving'];
  const dataset = () => A.sets[tall() ? 'portrait' : 'desktop'];
  const pullCapture = () => 'range';
  // KEEP: the sections on the grid
  const T = {
    iris: 1.6, items: at(1), pull: at(2, 3), shelf: at(3, 1), counts: at(3, 2), mark: 8.62,
    orbit: at(4, 2), words: 9.25, wordsOut: 11.25, collapse: 11.3, iris2: 11.62, fly: 11.72, search: at(6), type: at(6, 0.5), fade: 13.38, end: at(6, 3),
  };
  const T_ITEM = (i) => T.items + i * BEAT; // a new item every beat
  const COUNT_AT = [at(3, 2), at(3, 3), at(4)]; // one beat apart; settle at 7.25, 7.75 and 8.25

  // ---------- KEEP: assets ----------
  const A = { sets: {}, img: {}, plants: {} };
  const SEARCH = { orbitTile: 'can-yuzu' };
  const cap = (name) => { const form=name==='range'?(tall()?'portrait-range':'rev7-range'):(tall()?'portrait':'desktop'); const c=A.sets[form].captures[name];return {img:A.img[form+'/'+c.file],rect:c.rect,scale:c.scale}; };
  const R = (state) => (state==='range'?A.sets[tall()?'portrait-range':'rev7-range']:dataset()).rects[state];

  // ---------- KEEP: easing ----------
  const spring = (t,k=170,d=26) => tall() ? m.settle(t, .5) : kitSpring(t,k,d);
  const out3 = (p) => tall() ? m.out(p) : 1 - (1 - clamp(p)) ** 3;
  const in3 = (p) => tall() ? m.inOut(p) : clamp(p) ** 3;
  const inOut3 = (p) => { if(tall())return m.inOut(p); p = clamp(p); return p < 0.5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2; };
  const pullEase = (p) => tall() ? m.inOut(p) : 1 - (1 - clamp(p)) ** 3.5; // front-loaded: half the zoom in the first fifth
  const ramp = (t, a, b) => clamp((t - a) / (b - a));
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, p) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], clamp(p)))).join(',')})`; };

  // ---------- KEEP: type. Every block is fitted (shrunk, then wrapped) to its box ----------
  function setText(c, font, size, tracking = 0, align = 'left') { c.font = font(size); c.letterSpacing = `${(tracking * size).toFixed(3)}px`; c.textBaseline = 'alphabetic'; c.textAlign = align; }
  const widthOf = (_c, font, size, s, tracking = 0) => { setText(metrics, font, size, tracking); return metrics.measureText(s).width; };
  const capCache = new Map();
  function capOf(font, size) {
    const key = font(100);
    if (!capCache.has(key)) { setText(metrics, font, 100); capCache.set(key, metrics.measureText('H').actualBoundingBoxAscent / 100); }
    return capCache.get(key) * size;
  }
  function wrapAt(font, size, tracking, words, maxW) {
    const lines = []; let cur = '';
    for (const w of words) { const next = cur ? `${cur} ${w}` : w; if (cur && widthOf(g, font, size, next, tracking) > maxW) { lines.push(cur); cur = w; } else cur = next; }
    if (cur) lines.push(cur);
    return lines;
  }
  // the largest size from max down to min at which the words wrap into maxLines lines of maxW;
  // balanced: the measure narrowed as far as it goes without adding a line
  const fitCache = new Map();
  function fit(text, font, { maxW, max, min, lines: maxLines = 1, tracking = 0, balance = true, maxH = Infinity, lead = 1.2 }) {
    const key = [text, font(100), maxW, max, min, maxLines, tracking, balance, maxH, lead].join('|');
    if (fitCache.has(key)) return fitCache.get(key);
    const words = String(text).trim().split(/\s+/).filter(Boolean);
    const ok = (size) => { const ls = wrapAt(font, size, tracking, words, maxW); return ls.length <= maxLines && ls.length * size * lead <= maxH && ls.every((l) => widthOf(g, font, size, l, tracking) <= maxW + 0.5) ? ls : null; };
    let size = max, lines = ok(max);
    if (!lines) {
      let lo = min, hi = max;
      for (let i = 0; i < 14; i++) { const mid = (lo + hi) / 2, ls = ok(mid); if (ls) { size = mid; lines = ls; lo = mid; } else hi = mid; }
      if (!lines) { size = min; lines = wrapAt(font, min, tracking, words, maxW); }
    }
    if (balance && lines.length > 1) {
      let lo = maxW * 0.5, hi = maxW, keep = lines;
      for (let i = 0; i < 12; i++) { const mid = (lo + hi) / 2, ls = wrapAt(font, size, tracking, words, mid); if (ls.length <= lines.length && ls.every((l) => widthOf(g, font, size, l, tracking) <= mid + 0.5)) { keep = ls; hi = mid; } else lo = mid; }
      lines = keep;
    }
    const out = { size, lines: lines.map((l) => ({ text: l, w: widthOf(g, font, size, l, tracking) })) };
    if (fitCache.size > 3000) fitCache.clear();
    fitCache.set(key, out);
    return out;
  }
  // a fitted block, drawn from its first baseline
  function block(c, L, font, x, y, { align = 'left', colour = INK, lead = 1.2, tracking = 0 } = {}) {
    setText(c, font, L.size, tracking, align); c.fillStyle = colour;
    L.lines.forEach((l, i) => c.fillText(l.text, x, y + i * L.size * lead));
  }
  // words through a slot: the line rises into a mask from below and leaves upward out of it
  function slot(c, draw, x0, top, w, h) { c.save(); c.beginPath(); c.rect(x0, top, w, h); c.clip(); draw(); c.restore(); }
  const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  // ---------- REPLACE: the approved Brewer's seal, from assets/mark.svg ----------
  const SEAL = new Path2D('M77 18H179C214 18 238 44 238 80V176C238 212 214 238 179 238H77C42 238 18 212 18 176V80C18 44 42 18 77 18ZM48 198H77V145H110V117H77V86H118V58H48ZM132 198H158V113L187 198H212V58H186V143L157 58H132Z');
  const MARK = { inkLeft: 6.5, inkRight: 57.5, inkTop: 3, dotY: 52.5, dotR: 6.5, centreY: 32 };
  function drawMark(c,x,y,s,colour,{dot=1,stem=1,leaves=[1,1],rot=0}={}) {
    // A static source logo; portrait motion is entirely markReveal's generic move.
    c.save(); c.translate(x,y); c.rotate(rot); c.scale(s*51/220,s*51/220);
    c.translate(-128,-(18+(MARK.dotY-MARK.inkTop)*220/51));
    c.fillStyle=colour; c.fill(SEAL,'evenodd'); c.restore();
  }

  // the lockup: mark, then the name, the mark's foot on the baseline and its ink 1.25 caps tall
  function lockup(size, baseline) {
    const font = SERIF(800), cap = capOf(font, size), s = (1.25 * cap) / (MARK.dotY + MARK.dotR - MARK.inkTop);
    const markW = (MARK.inkRight - MARK.inkLeft) * s, gap = size * 0.26, nameW = widthOf(g, font, size, V.brand, -0.015);
    const x0 = W / 2 - (markW + gap + nameW) / 2;
    return { s, cap, size, nameX: x0 + markW + gap, nameW, dot: [x0 + (32 - MARK.inkLeft) * s, baseline - MARK.dotR * s], baseline };
  }
  // the name's size: max, or smaller if the lockup would be wider than 84% of the frame
  function lockSize(max) {
    const font = SERIF(800), span = MARK.dotY + MARK.dotR - MARK.inkTop;
    const w100 = widthOf(g, font, 100, V.brand, -0.015) + 26 + (1.25 * capOf(font, 100) / span) * (MARK.inkRight - MARK.inkLeft);
    return Math.min(max, (W * 0.84) / w100 * 100);
  }

  // ---------- KEEP: a plant, a screen card ----------
  // a studio cut-out in a square box, its pot standing on a soft contact shadow (pot base 3.5% up)
  function drawPlant(c, id, cx, cy, s, alpha = 1, shadow = 1) {
    if (alpha <= 0) return;
    const img = A.plants[id];
    c.save(); c.globalAlpha *= alpha;
    if (shadow > 0) {
      const by = cy + s * 0.5, gr = c.createRadialGradient(cx, by, 0, cx, by, s * 0.26);
      gr.addColorStop(0, 'rgba(58,40,18,0.26)'); gr.addColorStop(0.55, 'rgba(58,40,18,0.1)'); gr.addColorStop(1, 'rgba(58,40,18,0)');
      c.save(); c.globalAlpha *= shadow; c.translate(cx, by); c.scale(1, 0.16); c.translate(-cx, -by); c.fillStyle = gr; c.beginPath(); c.arc(cx, by, s * 0.26, 0, Math.PI * 2); c.fill(); c.restore();
    }
    const ratio=img.width/img.height;
    if(id==='brewing'||id==='serving') {
      const sw=Math.min(img.width,img.height), sx=(img.width-sw)/2, sy=(img.height-sw)/2;
      c.drawImage(img,sx,sy,sw,sw,cx-s/2,cy-s/2,s,s);
    } else c.drawImage(img,cx-s/2,cy-s/2,s,s);
    c.restore();
  }
  // a captured phone screen as a card: rounded like the phone's own corners, on a soft shadow.
  // f: { k (frame px per CSS px), left, top, crop: [y0, y1] in CSS px, or the whole screen };
  // blur in px for the washed shelf. A cropped card is a clean close-up with its own corners.
  function drawScreen(c,name,f,alpha=1,blur=0) {
    if(alpha<=0)return;
    const {img,rect}=cap(name), [x,y,w,h]=rect, k=f.k;
    c.save();c.globalAlpha*=alpha;
    if(blur>.3)c.filter=`blur(${blur.toFixed(2)}px)`;
    c.save();c.shadowColor='rgba(29,26,22,.17)';c.shadowBlur=3*U;c.shadowOffsetY=U;
    roundRect(c,f.left+x*k,f.top+y*k,w*k,h*k,2*U);c.fillStyle=CREAM;c.fill();c.restore();
    roundRect(c,f.left+x*k,f.top+y*k,w*k,h*k,2*U);c.clip();c.drawImage(img,f.left+x*k,f.top+y*k,w*k,h*k);c.restore();
  }

  // ============================== ADAPT: the sections ==============================

  // ---- open (0–2 s): the mark grows, the name comes out of it, the line rises; the dot opens ----
  function open(t) {
    g.fillStyle = DEEP; g.fillRect(0, 0, W, H);
    const size = lockSize(tall() ? 14 * U : 13 * U), L = lockup(size, H / 2 + capOf(SERIF(800), size) / 2);
    // mark alone at the centre, then sliding left as the name is revealed out of it
    const m = spring(t - 0.45, 190, 24), solo = [W / 2, H / 2 + (MARK.dotY - MARK.centreY) * L.s];
    const dx = lerp(solo[0], L.dot[0], m), dy = lerp(solo[1], L.dot[1], m);
    const fold = 1 - in3(ramp(t, 1.46, 1.6)); // the leaves fold back into the dot before it opens
    const parts = { dot: lerp(2.2, 1, out3(ramp(t, 0, 0.3))), stem: out3(ramp(t, 0.08, 0.26)) * fold, leaves: [spring(t - 0.16, 240, 15) * fold, spring(t - 0.22, 240, 15) * fold] }; // the dot is there on frame 0
    // the name, revealed left to right from just right of the mark
    const r = out3(ramp(t, 0.5, 0.82));
    if (r > 0) {
      const markRight = dx + (MARK.inkRight - 32) * L.s;
      slot(g, () => { setText(g, SERIF(800), size, -0.015); g.fillStyle = CREAM; g.fillText(V.brand, dx + (L.nameX - L.dot[0]) - (1 - r) * L.nameW * 0.12, L.baseline); }, markRight + size * 0.08, 0, (L.nameW + size * 0.3) * r, H); // uncovered from the mark outward, first letter first
    }
    // the line under it
    const lr = out3(ramp(t, 0.62, 0.9));
    if (lr > 0) {
      const LL = fit(V.tagline, SANS(600), { maxW: W * 0.82, max: (tall() ? 4.4 : 3.8) * U, min: 2.6 * U, lines: 2 });
      g.save(); g.globalAlpha = lr; block(g, LL, SANS(600), W / 2, L.baseline + 9 * U + (1 - lr) * 2 * U, { align: 'center', colour: PALE, lead: 1.25 }); g.restore();
    }
    drawMark(g, dx, dy, L.s, CREAM, parts);
    return { dot: [dx, dy], r: MARK.dotR * L.s };
  }

  // ---- the items (2–5.5 s): a plant a beat ----
  function itemLayout() {
    if (tall()) return {
      plant: { cx: W / 2, cy: H * 0.405, s: W * 0.72 }, push: H * 0.16,
      ghost: { x: W / 2, baseline: H * 0.66, align: 'center', maxW: W * 0.82, max: 24 * U, lines: 1, lead: 1, maxH: H * 0.14 }, // one complete line at the foot of the can
      text: { align: 'center', x: W / 2, maxW: W * 0.86, latin: H * 0.7, name: H * 0.766, care: H * 0.816, latinSize: 3.6 * U, nameSize: 12 * U, careSize: 4.2 * U },
      head: { y: H * 0.10, x0: W * 0.07, x1: W * 0.93, size: 3.8 * U, pill: 3.2 * U }, bar: { y: H * 0.886, x0: W * 0.07, x1: W * 0.93, size: 3.2 * U },
    };
    if (wide()) return {
      plant: { cx: W * 0.28, cy: H * 0.54, s: H * 0.60 }, push: H * 0.2,
      ghost: { x: W * 0.52, baseline: H * 0.335, align: 'left', maxW: W * 0.41, max: 16 * U, lines: 1, lead: 1, maxH: H * 0.15 },
      text: { align: 'left', x: W * 0.52, maxW: W * 0.41, latin: H * 0.46, name: H * 0.58, care: H * 0.69, latinSize: 3.6 * U, nameSize: 10 * U, careSize: 4.2 * U },
      head: { y: H * 0.16, x0: W * 0.07, x1: W * 0.93, size: 3.6 * U, pill: 3.1 * U }, bar: { y: H * 0.89, x0: W * 0.07, x1: W * 0.93, size: 3.1 * U },
    };
    return {
      plant: { cx: W / 2, cy: H * 0.335, s: H * 0.42 }, push: H * 0.16,
      ghost: { x: W / 2, baseline: H * 0.63, align: 'center', maxW: W * 0.86, max: 14 * U, lines: 1, lead: 1, maxH: H * 0.12 },
      text: { align: 'center', x: W / 2, maxW: W * 0.86, latin: H * 0.667, name: H * 0.735, care: H * 0.79, latinSize: 3.4 * U, nameSize: 8.4 * U, careSize: 3.6 * U },
      head: { y: H * 0.15, x0: W * 0.07, x1: W * 0.93, size: 3.3 * U, pill: 2.9 * U }, bar: { y: H * 0.89, x0: W * 0.07, x1: W * 0.93, size: 2.8 * U },
    };
  }
  // the item on screen and the change into it: a change takes 0.22 s and lands on its beat, fast
  // first and soft at the end: the new one rises a short way into place as the old one rises out,
  // crossing over, so a moving item never travels through the words
  const LEAD = 0.2, CHANGE = 0.22, land = (x) => tall() ? m.out(x) : 1 - (1 - clamp(x)) ** 2.6;
  function itemAt(t) { let i = 0; for (let k = 1; k < N; k++) if (t >= T_ITEM(k) - LEAD) i = k; return i; }
  const changeP = (t, i, delay = 0) => (i === 0 ? out3(ramp(t, T.items - 0.16 + delay, T.items + 0.12 + delay)) : land(ramp(t, T_ITEM(i) - LEAD + delay, T_ITEM(i) - LEAD + CHANGE + delay)));
  const plantScale = (t, i) => 1 + 0.03 * (tall() ? m.inOut((t - T_ITEM(i)) / 1) : clamp((t - T_ITEM(i)) / 1)); // the camera breathes in on each plant
  // a number in the detail line ticks from the last item's number to this one's: { num, now }
  function ticking(t, i) {
    const m = item(i).care.match(/\d+/);
    if (!m || i === 0) return null;
    const was = (item(i - 1).care.match(/\d+/) || [])[0];
    if (was === undefined) return null;
    const q = out3(ramp(t, T_ITEM(i) - LEAD, T_ITEM(i) + 0.04)); // done as the item lands: a still on the beat shows the true number
    return { num: m[0], now: String(Math.round(lerp(+was, +m[0], q))) };
  }

  function drawGhost(L, text, offY, alpha) {
    if (alpha <= 0.01) return;
    // Very short edits have no surrounding letters to carry the word past the can.
    const G = L.ghost, max = !wide() && String(text).trim().length <= 3 ? (tall() ? 16 : 6) * U : G.max;
    const B = fit(text, SERIF(800), { maxW: G.maxW, max, min: 2.4 * U, lines: G.lines, tracking: -0.02, maxH: G.maxH, lead: G.lead });

  }
  const boxPoint=(f,n)=>{const b=R('box').plus[n];return {x:f.left+(b[0]+b[2]/2)*f.k,y:f.top+(b[1]+b[3]/2)*f.k};};
  // CSS page coordinates measured from the real 390 px capture. The base
  // image is immutable; lossy WebP differences elsewhere are never composited.
  function boxRegions(i) {
    const b=R('box').plus[i];
    if(!tall())return {
      total:[1280,501.5,98,27],minus:[b[0]-90,b[1]-2,44,44],
      quantity:[b[0]-46,b[1]+2,44,36],reset:[1018.5,784.8,83,27],
      press:[b[0]-2,b[1]-2,b[2]+4,b[3]+4],
    };
    return {
      total:[23,506.3,109,24], subtotal:[276,605.3,91,19],
      progress:[23+i*(344/12),541.3,30,11],
      minus:[b[0]-82,b[1]-2,42,42], quantity:[b[0]-42,b[1]-2,40,42],
      reset:[190,862.3,84,23], press:[b[0]-2,b[1]-2,b[2]+4,b[3]+4],
    };
  }
  function boxBounds(f,b) {
    const x=Math.floor(f.left+b[0]*f.k),y=Math.floor(f.top+b[1]*f.k);
    return [x,y,Math.ceil(f.left+(b[0]+b[2])*f.k)-x,Math.ceil(f.top+(b[1]+b[3])*f.k)-y];
  }
  function boxPatch(name,f,box,{dy=0,reveal=1}={}) {
    if(reveal<=0)return;
    const {img,rect:[x,y,w,h]}=cap(name),[bx,by,bw,bh]=boxBounds(f,box);
    g.save();g.beginPath();g.rect(bx,by,bw,bh);g.clip();
    g.beginPath();g.rect(bx,by+dy,bw*reveal,bh);g.clip();
    g.drawImage(img,f.left+x*f.k,f.top+y*f.k+dy,w*f.k,h*f.k);g.restore();
  }
  function boxRoll(before,after,f,box,p) {
    const h=boxBounds(f,box)[3],dy=Math.round(p*h);
    boxPatch(before,f,box,{dy:-dy});boxPatch(after,f,box,{dy:h-dy});
  }
  function motionBox(t,f) {
    drawScreen(g,'box-00',f);
    for(const [i,hit] of BOX_CLICKS.entries()) {
      if(t<hit)continue;
      const before=`box-${String(i).padStart(2,'0')}`,after=`box-${String(i+1).padStart(2,'0')}`;
      const boxes=boxRegions(i),p=m.out((t-hit)/.20);
      boxRoll(before,after,f,boxes.total,p);
      if(boxes.subtotal)boxRoll(before,after,f,boxes.subtotal,p);
      if(boxes.progress)boxPatch(after,f,boxes.progress,{reveal:m.out((t-hit)/.28)});
      boxPatch(after,f,boxes.minus,{reveal:p});
      boxRoll(before,after,f,boxes.quantity,p);
      if(i===0)boxPatch(after,f,boxes.reset,{reveal:p});
      // Press only the captured + button, from the exact cursor hit frame.
      const press=Math.max(.15,m.inOut((t-hit)/.04))*(1-m.settle(t-hit-.06,.14));
      if(press>0) {
        const b=R('box').plus[i],point=boxPoint(f,i),{img,rect:[x,y,w,h]}=cap('box-00');
        const [bx,by,bw,bh]=boxBounds(f,boxes.press);
        g.save();g.beginPath();g.rect(bx,by,bw,bh);g.clip();
        g.fillStyle=(tall()?A.buttonBackground:A.desktopButtonBackground)[i];g.fillRect(bx,by,bw,bh);
        g.translate(point.x,point.y);g.scale(1-.08*press,1-.08*press);g.translate(-point.x,-point.y);
        g.beginPath();g.rect(f.left+b[0]*f.k,f.top+b[1]*f.k,b[2]*f.k,b[3]*f.k);g.clip();
        g.drawImage(img,f.left+x*f.k,f.top+y*f.k,w*f.k,h*f.k);g.restore();
      }
    }
  }
  function motionProof(t) {
    g.fillStyle=CREAM;g.fillRect(0,0,W,H);
    const f=searchFrame(T.search);
    motionBox(t,f);
    m.drawCursor(g,{t,path:[
      {at:P.proof+.05,from:{x:W+8*U,y:H*.38},to:boxPoint(f,0),dur:.30,curve:.18},
      {at:BOX_CLICKS[0]+.08,to:boxPoint(f,1),dur:.24,curve:-.18},
      {at:BOX_CLICKS[1]+.08,to:boxPoint(f,2),dur:.24,curve:.18},
      {at:BOX_CLICKS[2]+.35,to:{x:W+6*U,y:H*.72},dur:.25,exit:true},
    ],press:BOX_CLICKS,theme:{fill:INK,stroke:PAPER,accent:SPROUT,seed:17}});
  }
  function slide(t,start,dur,drawOld,drawNew,axis='x') {
    const p=m.inOut((t-start)/dur),distance=axis==='x'?W:H;
    g.save();g.translate(axis==='x'?-p*distance:0,axis==='y'?-p*distance:0);drawOld();g.restore();
    g.save();g.translate(axis==='x'?(1-p)*distance:0,axis==='y'?(1-p)*distance:0);drawNew();g.restore();
  }
  function portraitFrame(t) {
    if(t<1.8){motionOpen(t);return;}
    if(t<P.items+.1){slide(t,1.8,.3,()=>motionOpen(1.8),()=>portraitItem(Math.max(P.items,t)));return;}
    if(t<P.pull){portraitItem(t);return;}
    if(t<P.counts){portraitShelf(t);return;}
    if(t<P.orbit-.2){portraitCounts(t);return;}
    if(t<P.orbit+.1){slide(t,P.orbit-.2,.3,()=>portraitCounts(P.orbit-.2),()=>portraitOrbit(Math.max(P.orbit,t)),'y');return;}
    if(t<P.proof){portraitOrbit(t);return;}
    if(t<P.proof+.3){slide(t,P.proof,.3,()=>portraitOrbit(t),()=>motionProof(t));return;}
    if(t<P.close){motionProof(t);return;}
    if(t<P.end){slide(t,P.close,.3,()=>motionProof(t),()=>motionEnd(t),'y');return;}
    motionEnd(t);
  }

  // ---------- KEEP: the sections in order ----------
  function frame(t) {
    portraitFrame(t);
  }
  function seek(t, values) {
    V = { ...DEFAULTS, ...values };
    shape = SHAPES[V.size] ? V.size : '9:16'; [W, H] = SHAPES[shape]; U = Math.min(W, H) / 100;
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    g.reset(); metrics.reset();
    g.imageSmoothingQuality = 'high';
    frame(clamp(t, 0, DURATION - 1e-6));
    return canvas;
  }
  async function prepare() {
    await Promise.all([
      loadFont('Bricolage','assets/fonts/bricolage-grotesque-variable.ttf',{weight:'200 800'}),
      loadFont('DMSans','assets/fonts/dm-sans-variable.ttf',{weight:'100 1000'}),

    ]);
    for(const form of ['mobile','desktop','portrait','portrait-range','rev7-range']) {
      A.sets[form]=await(await fetch(`assets/screens/${form}/screens.json`)).json();
      await Promise.all(Object.values(A.sets[form].captures).map(async c=>{A.img[form+'/'+c.file]=await loadImage(`assets/screens/${form}/${c.file}`);}));
    }
    await Promise.all(ORBIT.map(async id=>{A.plants[id]=await loadImage(`assets/photos/${id}.webp`);}));
    [A.wordmark,A.wordmarkPaper]=await Promise.all([loadImage('assets/wordmark.svg'),loadImage('assets/wordmark-paper.svg')]);
    const sample=document.createElement('canvas');sample.width=sample.height=1;
    const sampleContext=sample.getContext('2d',{willReadFrequently:true});
    const original=A.sets.portrait.captures['box-00'];
    A.buttonBackground=A.sets.portrait.rects.box.plus.map(b=>{
      sampleContext.reset();sampleContext.drawImage(A.img['portrait/'+original.file],(b[0]-original.rect[0]-2)*original.scale,(b[1]-original.rect[1]+b[3]/2)*original.scale,1,1,0,0,1,1);
      const [r,g,bg]=sampleContext.getImageData(0,0,1,1).data;return `rgb(${r},${g},${bg})`;
    });
    const desktop=A.sets.desktop.captures['box-00'];
    A.desktopButtonBackground=A.sets.desktop.rects.box.plus.map(b=>{
      sampleContext.reset();sampleContext.drawImage(A.img['desktop/'+desktop.file],(b[0]-desktop.rect[0]-2)*desktop.scale,(b[1]-desktop.rect[1]+b[3]/2)*desktop.scale,1,1,0,0,1,1);
      const [r,g,bg]=sampleContext.getImageData(0,0,1,1).data;return `rgb(${r},${g},${bg})`;
    });
    await document.fonts.ready;
  }

  // ---------- ADAPT: the cues (sound on every move), the score ----------
  function cues(values) {
    if((values?.size||'9:16')==='9:16')return portraitCues(values);
    // Match the approved cues, with the two inherited late sweeps moved to
    // the first moving frame in these newly adapted shapes only.
    return portraitCues(values).map(c=>({...c,t:
      Math.abs(c.t-(P.pull+.22))<1e-6?P.pull:
      Math.abs(c.t-(P.orbit-.15))<1e-6?P.orbit-.2:c.t}));
  }

  function portraitCues(values) {
    const out=[],add=(t,type,gain=.5,motion)=>out.push({t,type,gain,...(motion?{motion}:{})});
    add(.30,'sparkle',.35);add(.50,'tick',.3);add(P.items,'tap',.5);
    for(let i=1;i<N;i++)add(P.items+i*P.step,'tap',.5);
    // move sounds sit just under v1's level (the kit's sweeps are 9 dB quieter since 2026-10-15);
    // the pull's whoosh crests at its fastest frame
    add(P.pull+.22,'whoosh',.4,{kind:'camera',travel:.6});
    for(let i=0;i<3;i++)for(let k=0;k<3;k++)add(P.counts+i*.12+k*.07,'tick',.35);
    add(P.orbit-.15,'whoosh',.35,{kind:'container',travel:1});
    add(P.orbit+.15,'tick',.4);add(P.converge,'swish',.3,{kind:'container',travel:.35});
    add(P.proof,'whoosh',.35,{kind:'container',travel:1});
    BOX_CLICKS.forEach(t=>add(t,'click',.6));
    add(P.close,'whoosh',.3,{kind:'container',travel:1});add(P.close+.50,'sparkle',.35);
    return out;
  }
  const music = {
    bpm: BPM, duration: DURATION, root: 50, // D: warm, unhurried
    chords: [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]],
    sections: [
      { from: 0, to: 1, pad: 0.75, hats: 0.25 },
      { from: 1, to: 3, kick: 0.8, hats: 0.55, bass: 0.7, pad: 0.5 },
      { from: 3, to: 4, kick: 0.75, hats: 0.5, clap: 0.35, bass: 0.7, pad: 0.55 },
      { from: 4, to: 8, kick: 0.65, hats: 0.4, clap: 0.3, bass: 0.65, pad: 0.55 },
      { from: 8, to: 9, kick: 0.5, hats: 0.3, bass: 0.6, pad: 0.6 },
      { from: 9, to: 11, pad: 0.7, hats: 0.15 },
    ],
    breaks: [[1.75, P.items], [P.pull - .25, P.pull], [P.orbit - .25, P.orbit], [P.close, P.end]],
  };
  const STATES = [[0,'Open'],[P.items,'Items'],[P.pull,'Catalogue'],[P.counts,'Numbers'],[P.orbit,'Orbit'],[P.proof,'Build a box'],[P.end,'End']];
  window.template = {
    fps: FPS, duration: DURATION, sizes: SHAPES, width: W, height: H, defaults: () => ({ size: '9:16', ...DEFAULTS }), fields: FIELDS, states: STATES,
    prepare, seek: (t, values) => seek(t, values), cues, music,
    // No circular masks in the portrait cut; all large moves use blur normally.
    shutters: [],
    keyTimes: [0,.02,.12,.30,.40,.50,.65,.80,1.75,1.85,2.1,2.3,
      ...ITEMS.flatMap((_,i)=>[P.items+i*P.step+.25,P.items+(i+1)*P.step-.01]),
      P.pull,P.pull+.3,P.shelf,P.counts,P.counts+.6,P.orbit-.21,P.orbit,P.orbit+.5,
      P.converge-.16,P.converge,P.converge+.2,P.proof,P.proof+.2,P.proof+.7,P.proof+1.3,
      P.close-.01,P.close+.1,P.close+.12,P.end,P.close+.5,P.close+.66,P.close+.82,P.close+1.2,DURATION-1/60],
  };
  const q = new URLSearchParams(location.search);
  if(window.parent!==window || q.has('render')) document.getElementById('credit').hidden=true;
  if (window.parent === window && !q.has('render')) prepare().then(() => { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION, { size: q.get('size') || '9:16' }); requestAnimationFrame(loop); }; loop(); });
})();
</script>
