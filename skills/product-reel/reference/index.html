<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernwise · Product reel · Fictional company</title>
<style>
  html, body { margin: 0; height: 100%; background: #F6F1E7; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<footer id="credit" style="position:fixed;bottom:8px;left:12px;right:12px;font:11px/1.4 system-ui;color:#928a7d;text-align:center">
  Fernwise is a fictional company made for omnigami’s examples. · <a style="color:inherit" href="https://x.com/justinmfarrugia/status/2103822390870569266" target="_blank" rel="noopener noreferrer">Style inspired by @justinmfarrugia’s video</a>
</footer>
<script src="kit.js"></script>
<script>
// The product reel's reference: a 22 s reel of everything Fernwise keeps (a fictional plant-care
// app, omnigami's cast). One choreography and timeline in every shape; tall first, laid out again
// for square and wide. 120 BPM: a logo open, a
// plant every beat (its name and care line beside it, its common name huge and pale behind it, a
// segmented progress bar), the last plant pulling back into the app's real Shelf screen, the
// account's numbers counting up, plant tiles orbiting the line, the real search typing into real
// results, and the name with its address. Every screen is a capture of the working app
// (plans/mobile.json → assets/screens/, with screens.json saying where every element sits); every
// plant is a studio cut-out (assets/plants/). STORY.md has every word and number with its source.
//
// How it's built, and what a new reel changes (style.md has the grammar):
//   KEEP    the grid, the shapes, the toolkit (type, mark-free motion, camera, screen cards), the
//           order of sections and their times, the drawing, the sound
//   ADAPT   the words (DEFAULTS), the colours and fonts, the items (ITEMS), the screens and rects
//           (PULL, SEARCH), the orbit's tiles, the numbers, the cues
//   REPLACE the mark (KEEPER, Fernwise's approved path; drawMark and motionMark draw it): your
//           product's mark from its own paths or an image. Its open and close are the generic
//           kit.motion.markReveal, so any logo works.
(() => {
  const { clamp, lerp, loadFont, loadImage, roundRect, motion: m } = window.kit;
  const FPS = 60, F = 1 / 12, BPM = 120, BEAT = 60 / BPM, BAR = 4 * BEAT, DURATION = 21.9; // P.close + 3.0: room for the score's last hit to ring out
  const at = (bar, beat = 0) => bar * BAR + beat * BEAT; // a time on the beat grid
  // each shape's frame. A phone app shows its phone screens in every shape: whole in tall, a
  // close-up card in square and wide (never a desktop page squeezed into a phone frame)
  const SHAPES = { '9:16': [1080, 1920], '1:1': [1440, 1440], '16:9': [1920, 1080] };
  let W = 1080, H = 1920, U = 10.8, shape = '9:16'; // U: 1% of the frame's short side
  const tall = () => shape === '9:16', wide = () => shape === '16:9';

  const canvas = document.getElementById('c');
  let g = canvas.getContext('2d', { willReadFrequently: true });
  const metrics = document.createElement('canvas').getContext('2d', { willReadFrequently: true });


  // ---------- ADAPT: the brand's colours and fonts (cast/fernwise/brand.md) ----------
  const CREAM = '#F6F1E7', PAPER = '#FFFDF8', SAND = '#EADFCB', MOSS = '#3E6B3A', DEEP = '#28452A', SPROUT = '#9CC57A';
  const TERRA = '#C4613D', AMBER = '#D8A12E', INK = '#2B2A26', MUTED = '#706C60', TRACK = '#E2D7C2', GHOST = '#C9B898', PALE = '#C9D6BE';
  const TONES = { due: TERRA, light: AMBER, fine: MOSS };
  const SAGE = '#E8EAD6'; // cream with a breath of sprout: every other item stands on it
  const FIELD = (i) => (i % 2 ? SAGE : CREAM); // the last item must stand on the screen's colour (cream) // the pill's dot: the ring's own meaning
  const SERIF = (w = 480) => (s) => `${w} ${s}px Fraunces`; // display instance: SOFT 100, WONK 0, opsz 144
  const SANS = (w = 600) => (s) => `${w} ${s}px Nunito`;

  // ---------- ADAPT: the words, as named fields (sources in STORY.md) ----------
  const DEFAULTS = {
    brand: 'Fernwise', tagline: 'Plant care for people who forget to water.',
    p1name: 'Monty', p1kind: 'Swiss cheese plant', p1latin: 'Monstera deliciosa', p1care: 'Water every 7 days · Bright, indirect', p1status: 'Due today',
    p2name: 'Pickles', p2kind: 'Pancake plant', p2latin: 'Pilea peperomioides', p2care: 'Water every 6 days · Bright, indirect', p2status: 'Due today',
    p3name: 'Fernando', p3kind: 'Boston fern', p3latin: 'Nephrolepis exaltata', p3care: 'Water every 3 days · Medium light', p3status: 'Due today',
    p4name: 'Olive', p4kind: 'Olive tree', p4latin: 'Olea europaea', p4care: 'Water every 10 days · Full sun', p4status: 'In 6 days',
    p5name: 'Dot', p5kind: 'Polka dot plant', p5latin: 'Hypoestes phyllostachya', p5care: 'Water every 4 days · Bright, indirect', p5status: 'Needs light',
    p6name: 'Basil', p6kind: 'Sweet basil', p6latin: 'Ocimum basilicum', p6care: 'Water every 2 days · Sunny sill', p6status: 'Tomorrow',
    p7name: 'Spike', p7kind: 'Snake plant', p7latin: 'Dracaena trifasciata', p7care: 'Water every 14 days · Any light', p7status: 'In 5 days',
    n1: '7', n1label: 'plants', n2: '148', n2label: 'waterings this year', n3: '12', n3label: 'day streak',
    headline: 'Keep the little ones alive.', url: 'fernwise.example',
  };
  // ADAPT: the items, one a beat, in order: each one's photo (assets/plants/<photo>.webp) and the
  // tone of its pill. The last is the one the camera pulls back from, so it must be the photo at
  // PULL's place in the captured screen.
  // the third value scales the photo a little by the plant's real size (pot base fixed), so the
  // beats differ in more than silhouette
  const ITEMS = [['monty', 'due', 1.1], ['pickles', 'due', 0.9], ['fernando', 'due', 1], ['olive', 'fine', 1.12], ['dot', 'light', 0.86], ['basil', 'fine', 0.88], ['spike', 'fine', 1.06]];
  const N = ITEMS.length;
  const FIELDS = [
    { id: 'brand', type: 'text', label: 'Name', maxLength: 14 },
    { id: 'tagline', type: 'text', label: 'Line under the name', maxLength: 48 },
    ...ITEMS.flatMap((_, i) => [
      { id: `p${i + 1}name`, type: 'text', label: `Item ${i + 1}: name`, maxLength: 12 },
      { id: `p${i + 1}kind`, type: 'text', label: `Item ${i + 1}: word behind it`, maxLength: 20, ...(i ? {} : { help: 'Huge and pale behind the item: its kind or category.' }) },
      { id: `p${i + 1}latin`, type: 'text', label: `Item ${i + 1}: small line above`, maxLength: 26 },
      { id: `p${i + 1}care`, type: 'text', label: `Item ${i + 1}: detail line`, maxLength: 40, ...(i ? {} : { help: 'A number in it ticks from one item to the next.' }) },
      { id: `p${i + 1}status`, type: 'text', label: `Item ${i + 1}: pill`, maxLength: 14 },
    ]),
    { id: 'n1', type: 'text', label: 'Number 1', maxLength: 6 }, { id: 'n1label', type: 'text', label: 'Number 1: label', maxLength: 22 },
    { id: 'n2', type: 'text', label: 'Number 2', maxLength: 6 }, { id: 'n2label', type: 'text', label: 'Number 2: label', maxLength: 22 },
    { id: 'n3', type: 'text', label: 'Number 3', maxLength: 6 }, { id: 'n3label', type: 'text', label: 'Number 3: label', maxLength: 22 },
    { id: 'headline', type: 'text', label: 'The line in the orbit', maxLength: 34 },
    { id: 'url', type: 'text', label: 'Address', maxLength: 22 },
  ];
  let V = DEFAULTS; // set from seek's arguments on every frame
  const item = (i) => ({ photo: ITEMS[i][0], tone: ITEMS[i][1], scale: ITEMS[i][2] || 1, name: V[`p${i + 1}name`], kind: V[`p${i + 1}kind`], latin: V[`p${i + 1}latin`], care: V[`p${i + 1}care`], status: V[`p${i + 1}status`] });

  // ADAPT: the real screens. PULL: the capture the last item pulls back into, the state whose
  // rects say where things are, and which photo rect the item lands on (Spike: the shelf's fifth
  // tile, the centre of the grid). SEARCH: the empty search, the typed captures (name-01 …), the
  // field and the results list.
  // crop: the part of the screen square and wide show as a close-up, in CSS px (tall shows it whole)
  // tallCrop: tall shows the screen down to the grid's end (the tab bar off), large enough to read
  const PULL = { capture: 'shelf', state: 'shelf', photos: 'photos', index: 4, crop: [47, 500], wideCrop: [315, 503], tallCrop: [47, 691] }; // tall: the grid's own 16 px foot below Dot's tile
  // thumb: the first result's photo (the same studio photo as the orbit's last tile), where the
  // tile lands before the iris opens: inside .thumb (inset 3 3 0, contained)
  const SEARCH = { empty: 'add', typed: 'add-search', state: 'add-search', crop: [93, 516], tallCrop: [47, 754], thumbRadius: 16, thumbFill: '#EFE8DA', thumb: (r) => [r[0] + 3, r[1] + 4.5, r[2] - 6, r[2] - 6], orbitTile: 'monty' };
  const SCREEN = { w: 390, h: 844, radius: 47 }; // the phone screen in CSS px, and its corner
  // ADAPT: the orbit's tiles: every real photo you have, once each
  const ORBIT = ['monty', 'money-tree', 'pickles', 'moth-orchid', 'fernando', 'monstera-adansonii', 'olive', 'maidenhair-fern', 'spike', 'basil', 'dot'];

  // KEEP: the sections on the grid
  // The pull-back's own clock: portraitShelf maps the film's time onto it (P below is the film's).
  const T = { items: at(1), pull: at(2, 3), shelf: at(3, 1), search: at(6) };
  const T_ITEM = (i) => T.items + i * BEAT; // a new item every beat

  // ---------- KEEP: assets ----------
  const A = { screens: null, img: {}, plants: {} };
  const cap = (name) => { const c = A.screens.captures[name]; return { img: A.img[c.file], rect: c.rect, scale: c.scale }; };
  const R = (state) => A.screens.rects[state];

  // ---------- KEEP: easing ----------
  const spring = (t) => m.settle(t, .5);
  const out3 = (p) => m.out(p);
  const in3 = (p) => m.inOut(p);
  const inOut3 = (p) => m.inOut(p);
  const pullEase = (p) => m.inOut(p);
  const ramp = (t, a, b) => clamp((t - a) / (b - a));
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, p) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], clamp(p)))).join(',')})`; };

  // ---------- KEEP: type. Every block is fitted (shrunk, then wrapped) to its box ----------
  function setText(c, font, size, tracking = 0, align = 'left') { c.font = font(size); c.letterSpacing = `${(tracking * size).toFixed(3)}px`; c.textBaseline = 'alphabetic'; c.textAlign = align; }
  const widthOf = (_c, font, size, s, tracking = 0) => { setText(metrics, font, size, tracking); return metrics.measureText(s).width; };
  const capCache = new Map();
  function capOf(font, size) {
    const key = font(100);
    if (!capCache.has(key)) { setText(metrics, font, 100); capCache.set(key, metrics.measureText('H').actualBoundingBoxAscent / 100); }
    return capCache.get(key) * size;
  }
  function wrapAt(font, size, tracking, words, maxW) {
    const lines = []; let cur = '';
    for (const w of words) { const next = cur ? `${cur} ${w}` : w; if (cur && widthOf(g, font, size, next, tracking) > maxW) { lines.push(cur); cur = w; } else cur = next; }
    if (cur) lines.push(cur);
    return lines;
  }
  // the largest size from max down to min at which the words wrap into maxLines lines of maxW;
  // balanced: the measure narrowed as far as it goes without adding a line
  const fitCache = new Map();
  function fit(text, font, { maxW, max, min, lines: maxLines = 1, tracking = 0, balance = true, maxH = Infinity, lead = 1.2 }) {
    const key = [text, font(100), maxW, max, min, maxLines, tracking, balance, maxH, lead].join('|');
    if (fitCache.has(key)) return fitCache.get(key);
    const words = String(text).trim().split(/\s+/).filter(Boolean);
    const ok = (size) => { const ls = wrapAt(font, size, tracking, words, maxW); return ls.length <= maxLines && ls.length * size * lead <= maxH && ls.every((l) => widthOf(g, font, size, l, tracking) <= maxW + 0.5) ? ls : null; };
    let size = max, lines = ok(max);
    if (!lines) {
      let lo = min, hi = max;
      for (let i = 0; i < 14; i++) { const mid = (lo + hi) / 2, ls = ok(mid); if (ls) { size = mid; lines = ls; lo = mid; } else hi = mid; }
      if (!lines) { size = min; lines = wrapAt(font, min, tracking, words, maxW); }
    }
    if (balance && lines.length > 1) {
      let lo = maxW * 0.5, hi = maxW, keep = lines;
      for (let i = 0; i < 12; i++) { const mid = (lo + hi) / 2, ls = wrapAt(font, size, tracking, words, mid); if (ls.length <= lines.length && ls.every((l) => widthOf(g, font, size, l, tracking) <= mid + 0.5)) { keep = ls; hi = mid; } else lo = mid; }
      lines = keep;
    }
    const out = { size, lines: lines.map((l) => ({ text: l, w: widthOf(g, font, size, l, tracking) })) };
    if (fitCache.size > 3000) fitCache.clear();
    fitCache.set(key, out);
    return out;
  }
  // a fitted block, drawn from its first baseline
  function block(c, L, font, x, y, { align = 'left', colour = INK, lead = 1.2, tracking = 0 } = {}) {
    setText(c, font, L.size, tracking, align); c.fillStyle = colour;
    L.lines.forEach((l, i) => c.fillText(l.text, x, y + i * L.size * lead));
  }
  // words through a slot: the line rises into a mask from below and leaves upward out of it
  function slot(c, draw, x0, top, w, h) { c.save(); c.beginPath(); c.rect(x0, top, w, h); c.clip(); draw(); c.restore(); }
  const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  // ---------- REPLACE: Keeper, from the approved mark.svg path ----------
  // drawMark(c, x, y, s, colour, parts): (x, y) is the dot's centre and s the size of one of the
  // SVG's 64 units. Parts grow from 0 to 1 (springs may overshoot): the dot, the stem, each leaf.
  const KEEPER = new Path2D('M126 129V180C126 214 102 236 70 236C54 236 40 232 27 224L40 200C49 205 59 208 69 208C84 208 92 198 92 182V129H57V99H92V78C92 39 114 19 149 19C172 19 190 28 203 42L182 65C173 55 163 50 152 50C134 50 126 61 126 80V99H180L169 129Z');
  const MARK = {inkLeft:6.75,inkRight:50.75,inkTop:4.75,dotY:52.5,dotR:6.5,centreY:32};
  // REPLACE: the approved Keeper path, normalized from its 256-unit SVG to 64 units.
  function drawMark(c,x,y,s,colour) {
    // The static mark (the header's); its animated open and close belong to kit.motion.markReveal.
    c.save(); c.translate(x,y); c.scale(s,s); c.translate(-32,-MARK.dotY);
    c.fillStyle=colour; c.scale(.25,.25); c.fill(KEEPER,'evenodd'); c.restore();
  }


  // the lockup: mark, then the name, the mark's foot on the baseline and its ink 1.25 caps tall
  // the name's size: max, or smaller if the lockup would be wider than 84% of the frame
  // ---------- KEEP: a plant, a screen card ----------
  // a studio cut-out in a square box, its pot standing on a soft contact shadow (pot base 3.5% up)
  function drawPlant(c, id, cx, cy, s, alpha = 1, shadow = 1) {
    if (alpha <= 0) return;
    const img = A.plants[id];
    c.save(); c.globalAlpha *= alpha;
    if (shadow > 0) {
      const by = cy + s * 0.465, gr = c.createRadialGradient(cx, by, 0, cx, by, s * 0.26);
      gr.addColorStop(0, 'rgba(58,40,18,0.26)'); gr.addColorStop(0.55, 'rgba(58,40,18,0.1)'); gr.addColorStop(1, 'rgba(58,40,18,0)');
      c.save(); c.globalAlpha *= shadow; c.translate(cx, by); c.scale(1, 0.16); c.translate(-cx, -by); c.fillStyle = gr; c.beginPath(); c.arc(cx, by, s * 0.26, 0, Math.PI * 2); c.fill(); c.restore();
    }
    c.drawImage(img, cx - s / 2, cy - s / 2, s, s);
    c.restore();
  }
  // a captured phone screen as a card: rounded like the phone's own corners, on a soft shadow.
  // f: { k (frame px per CSS px), left, top, crop: [y0, y1] in CSS px, or the whole screen };
  // blur in px for the washed shelf. A cropped card is a clean close-up with its own corners.
  function drawScreen(c, name, f, alpha = 1, blur = 0) {
    if (alpha <= 0) return;
    const { img } = cap(name), w = SCREEN.w * f.k, h = SCREEN.h * f.k, [y0, y1] = f.crop || [0, SCREEN.h];
    const r = (f.crop ? 26 : SCREEN.radius) * f.k, cy = f.top + y0 * f.k, ch = (y1 - y0) * f.k;
    c.save(); c.globalAlpha *= alpha;
    c.save(); c.shadowColor = 'rgba(60,44,20,0.2)'; c.shadowBlur = 5 * U; c.shadowOffsetY = 1.8 * U;
    roundRect(c, f.left, cy, w, ch, r); c.fillStyle = CREAM; c.fill(); c.restore();
    roundRect(c, f.left, cy, w, ch, r); c.clip();
    if (blur > 0.3) c.filter = `blur(${blur.toFixed(2)}px)`;
    c.drawImage(img, f.left, f.top, w, h);
    c.restore();
  }

  // ============================== ADAPT: the sections ==============================

  // ---- open (0–2 s): the mark grows, the name comes out of it, the line rises; the dot opens ----
  // ---- the items (2–5.5 s): a plant a beat ----
  function itemLayout() {
    if (tall()) return {
      plant: { cx: W / 2, cy: H * 0.405, s: W * 0.72 }, push: H * 0.1,
      ghost: { x: W / 2, baseline: H * 0.66, align: 'center', maxW: W * 0.82, max: 24 * U, lines: 1, lead: 1, maxH: H * 0.14 }, // one complete line at the foot of the pot
      text: { align: 'center', x: W / 2, maxW: W * 0.86, latin: H * 0.7, name: H * 0.766, care: H * 0.816, latinSize: 3.6 * U, nameSize: 12 * U, careSize: 4.2 * U },
      head: { y: H * 0.10, x0: W * 0.07, x1: W * 0.93, size: 3.8 * U, pill: 3.2 * U }, bar: { y: H * 0.886, x0: W * 0.07, x1: W * 0.93, size: 3.2 * U },
    };
    if (wide()) return {
      plant: { cx: W * 0.31, cy: H * 0.465, s: H * 0.64 }, push: H * 0.2,
      ghost: { x: W * 0.555, baseline: H * 0.30, align: 'left', maxW: W * 0.395, max: 18 * U, lines: 2, lead: 1, maxH: H * 0.19 }, // beside the plant, above its small caption
      text: { align: 'left', x: W * 0.555, maxW: W * 0.395, latin: H * 0.405, name: H * 0.535, care: H * 0.625, latinSize: 3.6 * U, nameSize: 11 * U, careSize: 4.2 * U },
      head: { y: H * 0.085, x0: W * 0.045, x1: W * 0.955, size: 3.6 * U, pill: 3.1 * U }, bar: { y: H * 0.868, x0: W * 0.045, x1: W * 0.955, size: 3.1 * U },
    };
    return {
      plant: { cx: W / 2, cy: H * 0.375, s: H * 0.46 }, push: H * 0.075,
      ghost: { x: W / 2, baseline: H * 0.642, align: 'center', maxW: W * 0.94, max: 14 * U, lines: 1, lead: 1, maxH: H * 0.14 }, // below most of the pot, clear of the botanical caption
      text: { align: 'center', x: W / 2, maxW: W * 0.84, latin: H * 0.69, name: H * 0.785, care: H * 0.848, latinSize: 3.3 * U, nameSize: 9 * U, careSize: 3.9 * U, careLines: 1 },
      head: { y: H * 0.065, x0: W * 0.06, x1: W * 0.94, size: 3.3 * U, pill: 2.9 * U }, bar: { y: H * 0.93, x0: W * 0.06, x1: W * 0.94, size: 2.8 * U },
    };
  }
  // the item on screen and the change into it: a change takes 0.22 s and lands on its beat, fast
  // first and soft at the end: the new one rises a short way into place as the old one rises out,
  // crossing over, so a moving item never travels through the words
  const LEAD = 0.2, CHANGE = 0.22, land = (x) => m.out(x);
  const changeP = (t, i, delay = 0) => (i === 0 ? out3(ramp(t, T.items - 0.16 + delay, T.items + 0.12 + delay)) : land(ramp(t, T_ITEM(i) - LEAD + delay, T_ITEM(i) - LEAD + CHANGE + delay)));
  const plantScale = (t, i) => 1 + 0.03 * m.inOut((t - T_ITEM(i)) / 1); // the camera breathes in on each plant
  // a number in the detail line ticks from the last item's number to this one's: { num, now }
  function drawGhost(L, text, offY, alpha) {
    if (alpha <= 0.01) return;
    // Very short edits have no surrounding letters to carry the word past the pot.
    const G = L.ghost, max = !wide() && String(text).trim().length <= 3 ? (tall() ? 16 : 6) * U : G.max;
    const B = fit(text, SERIF(480), { maxW: G.maxW, max, min: 2.4 * U, lines: G.lines, tracking: -0.02, maxH: G.maxH, lead: G.lead });
    const baseline = G.baseline - (B.lines.length - 1) * B.size * G.lead + offY;
    g.save(); g.globalAlpha = 0.48 * alpha; // keep the pale tone; the complete word must still read
    block(g, B, SERIF(480), G.x, baseline, { align: G.align, colour: GHOST, lead: G.lead, tracking: -0.02 });
    g.restore();
  }
  function drawWords(L, it, tick, p, dir, delay) {
    // dir +1: arriving (rises into its slot), -1: leaving (rises out of it)
    // the old words leave in the first half of the change, the new ones arrive in the second
    const X = L.text, phase = (q) => (dir > 0 ? clamp((q - 0.45) / 0.55) : clamp(q / 0.42));
    const roll = (q, size) => (dir > 0 ? (1 - phase(q)) : -phase(q)) * size * 1.15, alpha = (q) => (dir > 0 ? phase(q) : 1 - phase(q));
    const lat = fit(it.latin, SANS(600), { maxW: X.maxW, max: X.latinSize, min: 2.4 * U });
    const nam = fit(it.name, SERIF(480), { maxW: X.maxW, max: X.nameSize, min: 5 * U, tracking: -0.01 });
    const car = fit(it.care, SANS(600), { maxW: X.maxW, max: X.careSize, min: 2.8 * U, lines: X.careLines || 2 });
    // the ticking number, set in the final line's size and breaks
    let ticked = !tick;
    const careLines = { size: car.size, lines: car.lines.map((l) => { if (!ticked && l.text.includes(tick.num)) { ticked = true; return { text: l.text.replace(tick.num, tick.now) }; } return l; }) };
    const rows = [[lat, SANS(600), X.latin, MUTED, 0, 0], [nam, SERIF(480), X.name, DEEP, -0.01, 0.35], [careLines, SANS(600), X.care, INK, 0, 0.7]];
    const sx = X.align === 'center' ? 0 : X.x, sw = X.align === 'center' ? W : W - X.x;

    for(const p of list){if((p.z<=0)!==front||p.alpha<=0)continue;
      g.save();g.globalAlpha*=p.alpha;g.translate(p.x,p.y);g.rotate(p.angle);
      roundRect(g,-p.w/2,-p.h/2,p.w,p.h,p.radius);g.fillStyle=PAPER;g.fill();g.clip();
      drawPlant(g,p.id,0,-p.h*.02,p.w*.86,1,0);
      g.fillStyle=`rgba(14,20,14,${clamp(p.depth)*.48})`;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore();}
  }
  function portraitOrbit(t) {
    g.fillStyle=DEEP;g.fillRect(0,0,W,H);motionTiles(t,false);
    const X=ringGeom().text,font=SERIF(480),B=fit(V.headline,font,{maxW:X.maxW,max:X.max,min:4*U,lines:3,tracking:-.015});
    const a=m.out((t-P.orbit-.15)/.3);
    g.save();g.globalAlpha*=a;g.translate(0,(1-a)*3*U);
    const baseline=X.cy*1-(B.lines.length-1)*B.size*1.06/2+capOf(font,B.size)/2;
    block(g,B,font,W/2,baseline,{align:'center',colour:CREAM,lead:1.06,tracking:-.015});g.restore();motionTiles(t,true);
  }
  // CSS boxes measured in the real 390 px captures. Lossy WebP differences
  // outside these elements never enter the composition. The list stays anchored
  // at y=276 as it shrinks; each row owns its replacement and exit mask.
  const SEARCH_REGIONS = {
    field: [19,173,352,52], label: [19,250,140,20],
    rows: [[17,275,356,80],[17,355,356,76],[17,431,356,76],
      [17,507,356,76],[17,583,356,76],[17,659,356,88]],
  };
  function searchBounds(f,b) {
    const x=Math.floor(f.left+b[0]*f.k),y=Math.floor(f.top+b[1]*f.k);
    return [x,y,Math.ceil(f.left+(b[0]+b[2])*f.k)-x,Math.ceil(f.top+(b[1]+b[3])*f.k)-y];
  }
  function searchPatch(name,f,b,{dy=0,alpha=1}={}) {
    if(alpha<=0)return;
    const {img}=cap(name),[x,y,w,h]=searchBounds(f,b);
    g.save();g.globalAlpha*=Math.min(1,alpha);
    const [y0,y1]=f.crop||[0,SCREEN.h];
    roundRect(g,f.left,f.top+y0*f.k,SCREEN.w*f.k,(y1-y0)*f.k,(f.crop?26:SCREEN.radius)*f.k);g.clip();
    g.beginPath();g.rect(x,y,w,h);g.clip();
    g.drawImage(img,f.left,f.top+dy,SCREEN.w*f.k,SCREEN.h*f.k);g.restore();
  }
  function searchState(t,f) {
    drawScreen(g,SEARCH.empty,f);
    SEARCH_KEYS.forEach((hit,i)=>{
      if(t<hit)return;
      const before=i?`${SEARCH.typed}-${String(i).padStart(2,'0')}`:SEARCH.empty;
      const after=`${SEARCH.typed}-${String(i+1).padStart(2,'0')}`;
      // The app updates as each key lands: the letter is there on its frame,
      // the count and the rows settle in place a moment later. Nothing slides.
      searchPatch(after,f,SEARCH_REGIONS.field);
      searchPatch(after,f,SEARCH_REGIONS.label,{alpha:m.out((t-hit)/.14)});
      SEARCH_REGIONS.rows.forEach((b,j)=>{
        const p=m.out((t-hit-j*.02)/.16),remaining=5-i;
        if(j>=remaining&&p>0){
          // A removed result fades and lifts a little inside its own row.
          searchPatch(after,f,b);
          searchPatch(before,f,b,{dy:-4*f.k*p,alpha:1-p});
        }else searchPatch(after,f,b,{alpha:p});
      });
    });
  }
  function motionProof(t) {
    g.fillStyle=CREAM;g.fillRect(0,0,W,H);
    const f=searchFrame(T.search);
    // Start only after the final filtered row lands, so state-change audits
    // have a stationary container. Keep the UI's scale fixed inside its card.
    f.top-=.7*U*m.inOut((t-SEARCH_KEYS[2]-.25)/(P.close-SEARCH_KEYS[2]-.25));
    searchState(t,f);
    const field=SEARCH_REGIONS.field,target={x:f.left+(field[0]+110)*f.k,y:f.top+(field[1]+field[3]/2)*f.k};
    m.drawCursor(g,{t,path:[
      {at:P.proof+.02,from:{x:W+8*U,y:H*.40},to:target,dur:.28,curve:.18},
      {at:SEARCH_KEYS[0]+.10,exit:true,dur:.22},
    ],press:[SEARCH_KEYS[0]],theme:{accent:MOSS,seed:17}});
  }
  function slide(t,start,dur,drawOld,drawNew,axis='x') {
    const p=m.inOut((t-start)/dur),distance=axis==='x'?W:H;
    // Opaque underlay under the shared subpixel edge of the adjacent scenes.
    // This prevents a translucent one-pixel seam during the whole-scene push.
    g.save();drawOld();g.restore();
    g.save();g.translate(axis==='x'?-p*distance:0,axis==='y'?-p*distance:0);drawOld();g.restore();
    g.save();g.translate(axis==='x'?(1-p)*distance:0,axis==='y'?(1-p)*distance:0);drawNew();g.restore();
  }
  function portraitFrame(t) {
    if(t<P.items-.2){motionOpen(t);return;}
    if(t<P.items+.1){slide(t,P.items-.2,.3,()=>motionOpen(t),()=>portraitItem(Math.max(P.items,t)));return;}
    if(t<P.pull){portraitItem(t);return;}
    if(t<P.counts){portraitShelf(t);return;}
    if(t<P.orbit-.2){portraitCounts(t);return;}
    if(t<P.orbit+.1){slide(t,P.orbit-.2,.3,()=>portraitCounts(t),()=>portraitOrbit(Math.max(P.orbit,t)),'y');return;}
    if(t<P.proof){portraitOrbit(t);return;}
    if(t<P.proof+.3){slide(t,P.proof,.3,()=>portraitOrbit(t),()=>motionProof(t));return;}
    if(t<P.close){motionProof(t);return;}
    motionEnd(t);
  }

  // ---------- KEEP: the sections in order ----------
  function frame(t) {
    portraitFrame(t);
  }
  function seek(t, values) {
    V = { ...DEFAULTS, ...values };
    shape = SHAPES[V.size] ? V.size : '9:16'; [W, H] = SHAPES[shape]; U = Math.min(W, H) / 100;
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    g.reset(); metrics.reset();
    g.imageSmoothingQuality = 'high';
    frame(clamp(t, 0, DURATION - 1e-6));
    return canvas;
  }
  async function prepare() {
    await Promise.all([
      loadFont('Fraunces', 'assets/fonts/fraunces-soft-display.ttf', { weight: '100 900' }),
      loadFont('Nunito', 'assets/fonts/nunito-variable.ttf', { weight: '200 1000' }),
    ]);
    A.screens = await (await fetch('assets/screens/screens.json')).json();
    const ids = [...new Set([...ITEMS.map((x) => x[0]), ...ORBIT])];
    await Promise.all([
      ...ids.map(async (id) => { A.plants[id] = await loadImage(`assets/plants/${id}.webp`); }),
      ...Object.values(A.screens.captures).map(async (c) => { A.img[c.file] = await loadImage(`assets/screens/${c.file}`); }),
    ]);
    await document.fonts.ready;
  }

  // ---------- ADAPT: contacts/results; sweeps only for measured large moves ----------
  function cues(values) {
    return portraitCues(values);
  }
  function portraitCues(values) {
    const out=[],add=(t,type,gain=.5,motion)=>out.push({t,type,gain,...(motion?{motion}:{})});
    add(.1,'pop',.4); // the opening tile starts to grow
    // Cues mark the first moving frame (a zero-progress frame may lead by 1/60 s).
    add(P.items-.2,'whoosh',.35,{kind:'container',travel:1});
    for(let i=0;i<N;i++)add(P.items+i*P.step,'pop',.45);
    add(P.pull,'whoosh',.36,{kind:'camera',travel:.6});
    for(let i=0;i<3;i++)add(P.counts+i*.12,'pop',.43);
    add(P.orbit-.2,'whoosh',.35,{kind:'container',travel:1});
    add(P.proof,'whoosh',.35,{kind:'container',travel:1});
    add(SEARCH_KEYS[0],'click',.65);
    SEARCH_KEYS.slice(1).forEach(t=>add(t,'tick',.65));
    add(P.close+.2,'pop',.4); // the closing tile starts to grow
    return out;
  }
  const music = {
    bpm: BPM, duration: DURATION, root: 50, // D3, upward-voiced major chords, 120 BPM
    chords: [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]],
    sections: [
      { from: 0, to: 1, pad: 0.75, hats: 0.25 },
      { from: 1, to: 3, kick: 0.8, hats: 0.55, bass: 0.7, pad: 0.5 },
      { from: 3, to: 4, kick: 0.75, hats: 0.5, clap: 0.35, bass: 0.7, pad: 0.55 },
      { from: 4, to: 8, kick: 0.65, hats: 0.4, clap: 0.3, bass: 0.65, pad: 0.55 },
      { from: 8, to: 9, kick: 0.5, hats: 0.3, bass: 0.6, pad: 0.6 },
      { from: 9, to: 11, pad: 0.7, hats: 0.15 },
    ],
    breaks: [[P.items-.25, P.items], [P.pull - .25, P.pull], [P.orbit - .25, P.orbit], [P.close, P.end]],
  };
  const STATES = [[0,'Open'],[P.items,'Items'],[P.pull,'Catalogue'],[P.counts,'Numbers'],[P.orbit,'Orbit'],[P.proof,'Search'],[P.end,'End']];
  window.template = {
    fps: FPS, duration: DURATION, sizes: SHAPES, width: W, height: H, defaults: () => ({ size: '9:16', ...DEFAULTS }), fields: FIELDS, states: STATES,
    prepare, seek: (t, values) => seek(t, values), cues, music,
    // Keep local captured text sharp during filtering; large pushes retain blur.
    shutters: [[SEARCH_KEYS[0]-.02,SEARCH_KEYS[2]+.25,0]],
    // Stress samples sit before and after each whole-scene push, not mid-push (a push carries words off the edge).
    keyTimes: [0,.02,.12,.35,.72,P.items-.21,P.items+.1,
      ...ITEMS.flatMap((_,i)=>[P.items+i*P.step+.25,P.items+(i+1)*P.step-.01]),
      P.pull,P.pull+.3,P.shelf,P.shelf+.5,P.counts,P.counts+.6,P.orbit-.21,P.orbit,P.orbit+.5,
      P.converge-.16,P.converge,P.converge+.2,P.proof,P.proof+.2,
      ...SEARCH_KEYS.flatMap(t=>[t,t+.06,t+.17]),SEARCH_KEYS[2]+.25,P.close-.01,
      P.close+.1,P.close+.2,P.end,P.close+.4,P.close+END_PUSH,P.close+1,DURATION-1/60],
  };
  const q = new URLSearchParams(location.search);
  if(window.parent!==window || q.has('render')) document.getElementById('credit').hidden=true;
  if (window.parent === window && !q.has('render')) prepare().then(() => { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION, { size: q.get('size') || '9:16' }); requestAnimationFrame(loop); }; loop(); });
})();
</script>
