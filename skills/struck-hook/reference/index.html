<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamplit · Struck hook · Fictional company example</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1220; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="kit.js"></script>
<script>
// "The old way, struck out": one shot, cut from the product film's reference (its hook, bars 0–1),
// here for Lamplit, a fictional developer tool made for omnigami's examples (cast/lamplit/).
// The problem in three huge lines that slam in on beats, then every line struck through in
// the accent, a line a step, and held. 5 s at 120 BPM, 60 fps, in wide, square and tall.
//
// What a new shot changes (style.md has the grammar):
//   ADAPT  the colours and the three lines (DEFAULTS, FIELDS)
//   KEEP   the grid, the shapes, the type toolkit, the hook's layout and timing, the cues
(() => {
  const { clamp, lerp, loadFont } = window.kit;
  const FPS = 60, F = 1 / 12, BPM = 120, BEAT = 60 / BPM, BAR = 4 * BEAT, DURATION = 5;
  // The grid starts one frame in, so the first frame is the clean, empty paper.
  const LEAD = 1 / FPS;
  const at = (bar, beat = 0) => LEAD + bar * BAR + beat * BEAT; // a time on the beat grid
  const SHAPES = { '16:9': [1920, 1080], '1:1': [1440, 1440], '9:16': [1080, 1920] };
  let W = 1920, H = 1080, U = 10.8; // U: 1% of the frame's short side

  const canvas = document.getElementById('c');
  const g = canvas.getContext('2d', { willReadFrequently: true });

  // ---------- ADAPT: the product's colours ----------
  // The ground is the old way's world (the product's own background: Lamplit is dark first);
  // the words in its text colour; the accent is the brand colour (Lamplit's amber), and here it
  // means "just arrived" and "the problem".
  const PAPER = '#0E1220', INK = '#ECEAE3', ACCENT = '#FFB23F';
  const SANS = (w) => (s) => `${w} ${s}px "Instrument Sans"`;

  // ---------- ADAPT: the words, as named fields ----------
  // Three lines, all of them the old way (the tool or method the product replaces, then what it
  // costs), because every one of them gets struck out.
  const DEFAULTS = { hook1: 'Cron on a box.', hook2: 'Retries by hand.', hook3: 'Pages at 3 a.m.' };
  const FIELDS = [
    { id: 'hook1', type: 'text', label: 'Line 1', maxLength: 18, help: 'All three lines are the old way, and all are struck through.' },
    { id: 'hook2', type: 'text', label: 'Line 2', maxLength: 18 },
    { id: 'hook3', type: 'text', label: 'Line 3', maxLength: 18 },
  ];
  let V = DEFAULTS; // set from seek's arguments on every frame

  // ---------- KEEP: the type toolkit. Words slam in and arrive in the accent ----------
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, p) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], clamp(p)))).join(',')})`; };
  const steps = (t, t0) => (t - t0) / F; // time since t0 in steps of 1/12 s, the choreography's unit
  const out3 = (p) => 1 - (1 - clamp(p)) ** 3;
  // new words arrive in the accent and cool to their colour: a quarter second, then settling
  const arrive = (t, t0, colour) => { const d = steps(t, t0); return d < 2.5 ? ACCENT : d < 5 ? mix(ACCENT, colour, (d - 2.5) / 2.5) : colour; };
  function setText(c, font, size, tracking = -0.03) { c.font = font(size); c.letterSpacing = `${tracking * size}px`; c.textBaseline = 'alphabetic'; }
  const widthOf = (c, font, size, s, tracking) => { setText(c, font, size, tracking); return c.measureText(s).width; };
  const capOf = (size) => size * 0.7; // Instrument Sans' cap height

  // a word slammed in: from 116% and soft to set in 2.6 steps
  function slam(c, s, x, y, font, size, t, t0, colour, tracking) {
    const d = steps(t, t0);
    if (d < 0) return;
    const e = out3(d / 2.6), k = lerp(1.16, 1, e), blur = 10 * (1 - e) ** 2, alpha = lerp(0.55, 1, Math.sqrt(e));
    setText(c, font, size, tracking);
    const w = c.measureText(s).width;
    c.save(); c.globalAlpha *= alpha; if (blur > 0.2) c.filter = `blur(${blur * U / 10}px)`;
    c.translate(x + w / 2, y - capOf(size) / 2); c.scale(k, k);
    c.fillStyle = colour; c.fillText(s, -w / 2, capOf(size) / 2); c.restore();
  }
  // a line whose words land one after another, a step apart
  function line(c, text, x, y, font, size, t, t0, { colour = INK, stagger = F, align = 'left', tracking } = {}) {
    const words = text.split(' ').filter(Boolean), space = widthOf(c, font, size, ' ', tracking);
    const widths = words.map((w) => widthOf(c, font, size, w, tracking));
    const total = widths.reduce((a, b) => a + b, 0) + space * Math.max(0, words.length - 1);
    let wx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
    words.forEach((w, i) => { slam(c, w, wx, y, font, size, t, t0 + i * stagger, arrive(t, t0 + i * stagger, colour), tracking); wx += widths[i] + space; });
    return total;
  }

  // ---------- KEEP: the hook (bars 0–1, then a hold) ----------
  // The lines land on beats 0, 2 and 4; on the third beat of bar 1 every line is struck
  // through, a line a step; the struck lines hold to the end.
  const LANDS = [at(0, 0), at(0, 2), at(1, 0)], STRIKE = at(1, 2);
  function hook(t) {
    g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
    const margin = (W > H ? 11.2 : 8) * U; // the side margins: wider in a wide frame
    // an empty field drops its line; the rest close up and stay centred
    const lines = [V.hook1, V.hook2, V.hook3].map((s, i) => [String(s || '').trim(), LANDS[i]]).filter(([s]) => s);
    if (!lines.length) return;
    // one size for all three, the widest line fitted between the margins: up to 15.5% of the short
    // side, or 20% in a wide frame, where the width would otherwise go unused
    const size = Math.min((W > H ? 20 : 15.5) * U, ...lines.map(([s]) => (W - 2 * margin) / widthOf(g, SANS(700), 100, s) * 100));
    // the lines are left-aligned, and the block they make is centred in the frame
    const widest = Math.max(...lines.map(([s]) => widthOf(g, SANS(700), size, s))), x = (W - widest) / 2;
    // centred on the middle of the frame; in tall a little above it (42%), clear of the buttons
    // feeds lay over the right side and the captions at the bottom of a tall video
    const lead = size * 1.02, y0 = H * (W < H ? 0.42 : 0.5) - (lines.length - 1) * lead / 2 + capOf(size) / 2;
    lines.forEach(([s, t0], i) => {
      if (t < t0) return;
      const w = line(g, s, x, y0 + i * lead, SANS(700), size, t, t0, { colour: INK });
      // the strike: a bar through the x-height, drawn left to right in 3 steps, a line a step after the last
      const p = out3(steps(t, STRIKE + i * F) / 3);
      if (p > 0) { g.fillStyle = ACCENT; g.fillRect(x - 0.6 * U, y0 + i * lead - capOf(size) * 0.46, (w + 1.2 * U) * p, size * 0.085); }
    });
  }

  // ---------- KEEP: drawing, loading, sound ----------
  function seek(t, values) {
    V = { ...DEFAULTS, ...values };
    [W, H] = SHAPES[V.size] || SHAPES['16:9']; U = Math.min(W, H) / 100;
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    g.reset();
    hook(clamp(t, 0, DURATION - 1e-6));
    return canvas;
  }
  async function prepare() {
    await loadFont('Instrument Sans', 'assets/fonts/instrument-sans-variable.ttf', { weight: '400 700', stretch: '75% 100%' });
    await document.fonts.ready;
  }
  // a soft pop as each line lands, a tick as each strike starts: every sound on its visual onset
  function cues(values) {
    V = { ...DEFAULTS, ...values };
    const out = [];
    [V.hook1, V.hook2, V.hook3].forEach((s, i) => { if (String(s || '').trim()) out.push({ t: LANDS[i], type: 'pop', gain: 0.45 }, { t: STRIKE + i * F, type: 'tick', gain: 0.45 }); });
    return out.sort((a, b) => a.t - b.t);
  }
  // the bed: pad and hats under the lines; the hats drop out on the last beat of bar 1 and
  // the pad holds the struck lines
  const music = {
    bpm: BPM, duration: DURATION, root: 50, // D3, upward-voiced major chords
    chords: [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]],
    sections: [{ from: 0, to: 2, pad: 0.7, hats: 0.35 }, { from: 2, to: 3, pad: 0.8 }],
    breaks: [[at(1, 3), at(2)]],
  };
  const STATES = [[0, 'The old way'], [STRIKE, 'Struck']];
  window.template = {
    fps: FPS, duration: DURATION, sizes: SHAPES, width: W, height: H, defaults: () => ({ size: '16:9', ...DEFAULTS }), fields: FIELDS, states: STATES,
    prepare, seek: (t, values) => seek(t, values), cues, music,
    // settled moments: each line landed and cooled to ink, then every line struck
    keyTimes: [0.75, 1.75, 2.75, 3.75, 4.75],
  };
  const q = new URLSearchParams(location.search);
  if (window.parent === window && !q.has('render')) prepare().then(() => { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION, { size: q.get('size') || '16:9' }); requestAnimationFrame(loop); }; loop(); });
})();
</script>
