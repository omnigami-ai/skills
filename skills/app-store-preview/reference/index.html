<canvas id="c" width="886" height="1920"></canvas>

<script>
// Fernwise's App Store preview, the reference film of the app-store-preview skill. Fernwise is a
// fictional company made for omnigami's examples; every screen here is a real capture of its
// working app (cast/fernwise/app), made by scripts/screens.mjs from plans/fernwise.json at 3×
// (assets/screens/, with screens.json saying where every element sits).
//
// One film, two cuts, one story grid (28 s, 120 BPM, 30 fps):
//   '886:1920'           the store cut: Apple's App Store preview (iPhone, large and medium
//                        displays). Only the app's screens, full frame, touch hotspots, captions,
//                        dissolves, one music bed. template.encode gives its MP4 Apple's spec.
//   '9:16' '1:1' '16:9'  the social cut, in the grammar of @wallacex227's app promo: a dark
//                        ground, chapters, headlines, the app in a phone, callouts, a recap, an end card.
//
// How it's built, and what a new film changes (style.md has the grammar):
//   KEEP    the grid, the toolkit (type, frost, pill, touch, phone, callouts, tap rings), drawing,
//           the encode spec
//   ADAPT   the words (DEFAULTS), the colours, the moments (M), each cut's screen timeline,
//           taps, captions, callouts, the hook, the end, the cues and the music
//   REPLACE nothing: every moment is built from the app's own captures by name
(() => {
  const { clamp, lerp, loadFont, loadImage, roundRect, fitText, rng } = window.kit;
  const FPS = 30, BPM = 120, BEAT = 60 / BPM, BAR = 4 * BEAT, DURATION = 28, F = 1 / 15; // F: a step, two frames
  const STORE = '886:1920';
  const SIZES = { '886:1920': [886, 1920], '9:16': [1080, 1920], '1:1': [1440, 1440], '16:9': [1920, 1080] };
  let W = 886, H = 1920, U = 8.86, shape = STORE; // U: 1% of the frame's short side

  const canvas = document.getElementById('c');
  const g = canvas.getContext('2d', { willReadFrequently: true });

  // ---------- ADAPT: the app's colours (cast/fernwise/brand.md) ----------
  const CREAM = '#F6F1E7', MOSS = '#3E6B3A', MOSS_DEEP = '#28452A', SPROUT = '#9CC57A', SUN = '#F2C14E', INK = '#2B2A26';
  const GROUND = ['#22402a', '#142817', '#0c180e']; // the social cut's ground: moss-deep, darker to the edges
  const SERIF = (w) => (s) => `${w} ${s}px Fraunces`;
  const ITALIC = (w) => (s) => `italic ${w} ${s}px Fraunces`;
  const SANS = (w) => (s) => `${w} ${s}px Nunito`;

  // ---------- ADAPT: the words, as named fields ----------
  const DEFAULTS = {
    name: 'Fernwise', line: 'Plant care for people who forget to water.', tagline: 'Keep the little ones *alive.*',
    hook: "Who's thirsty *today?*",
    cap1: 'Three thirsty. *Three taps.*', cap2: 'Add a plant *by name.*', cap3: "Pale leaves? *Here's the plan.*", cap4: 'Find the *right light.*', cap5: 'Eight plants. *All watered.*',
    ch1: 'Water', ch2: 'Add', ch3: 'Rescue', ch4: 'Light',
    recap1: 'Watered.', recap2: 'Well lit.', recap3: '*Thriving.*',
    rating: '4.8', ratings: '12.4k ratings', button: 'Get Fernwise', where: 'Free on iPhone',
    plus: 'Fernwise Plus', disclosure: 'Light check, rescue guides and unlimited plants need Fernwise Plus.',
  };
  const FIELDS = [
    { id: 'name', type: 'text', label: 'App name', maxLength: 16 },
    { id: 'line', type: 'text', label: 'Opening line (store)', maxLength: 52, help: 'What the app is, in its own words. The store cut opens on it.' },
    { id: 'cap1', type: 'text', label: 'Moment 1', maxLength: 34, help: 'The store caption and the social headline. *Stars* mark the accent phrase.' },
    { id: 'cap2', type: 'text', label: 'Moment 2', maxLength: 34 },
    { id: 'cap3', type: 'text', label: 'Moment 3', maxLength: 34 },
    { id: 'cap4', type: 'text', label: 'Moment 4', maxLength: 34 },
    { id: 'cap5', type: 'text', label: 'Payoff (store)', maxLength: 34 },
    { id: 'tagline', type: 'text', label: 'Tagline', maxLength: 36 },
    { id: 'plus', type: 'text', label: 'Subscription name', maxLength: 18 },
    { id: 'disclosure', type: 'text', label: 'Subscription disclosure (store)', maxLength: 80, help: 'Apple asks you to say which features need a subscription. No prices.' },
    { id: 'hook', type: 'text', label: 'Hook (social)', maxLength: 30 },
    { id: 'ch1', type: 'text', label: 'Chapter 1 (social)', maxLength: 12 },
    { id: 'ch2', type: 'text', label: 'Chapter 2 (social)', maxLength: 12 },
    { id: 'ch3', type: 'text', label: 'Chapter 3 (social)', maxLength: 12 },
    { id: 'ch4', type: 'text', label: 'Chapter 4 (social)', maxLength: 12 },
    { id: 'recap1', type: 'text', label: 'Recap, 1 (social)', maxLength: 14 },
    { id: 'recap2', type: 'text', label: 'Recap, 2 (social)', maxLength: 14 },
    { id: 'recap3', type: 'text', label: 'Recap, 3 (social)', maxLength: 14 },
    { id: 'rating', type: 'text', label: 'Rating (social)', maxLength: 4 },
    { id: 'ratings', type: 'text', label: 'Ratings count (social)', maxLength: 18 },
    { id: 'button', type: 'text', label: 'Button (social)', maxLength: 18 },
    { id: 'where', type: 'text', label: 'Under the button (social)', maxLength: 28 },
  ];
  let V = DEFAULTS; // set from seek's arguments on every frame

  // ---------- ADAPT: the moments (both cuts change moment together) ----------
  const M_BASE = { water: 2, add: 7.9, rescue: 13.6, light: 17.6, payoff: 21.6, end: 24.5 }; // the store cut's chapters
  let M = M_BASE; // the tall cut has its own beats (M_TALL)

  // ---------- KEEP: the app's real screens ----------
  const A = { m: null, img: {} };
  const cap = (name) => A.m.captures[name];
  const R = (state) => A.m.rects[state];
  const IMG = (name) => A.img[cap(name).file];
  // which recorded rects belong to a capture
  const STATE_OF = (name) => (name.startsWith('add-search') ? 'add-search' : name === 'rescue-scroll-00' ? 'rescue' : name.startsWith('rescue-scroll') ? 'rescue-scrolled' : name);
  const SCROLL = Array.from({ length: 11 }, (_, i) => `rescue-scroll-${String(i).padStart(2, '0')}`);
  const swipe = (t0) => SCROLL.slice(1).map((n, i) => [t0 + (i + 1) / FPS - 1e-3, n, 0]); // a scroll: one capture a frame, cut (the MP4's motion blur smooths it)
  // The store cut's own beats live with the social cut's (TS, SEQ_S, TAPS_S, below).
  // a point in a recorded rect, in the app's CSS px
  function pointIn(state, rectName, idx, fx = 0.5, fy = 0.5) {
    const r = idx === null || idx === undefined ? R(state)[rectName] : R(state)[rectName][idx];
    return [r[0] + r[2] * fx, r[1] + r[3] * fy];
  }

  // ---------- KEEP: the toolkit ----------
  // KEEP: house motion. Geometry is always evaluated from absolute film time.
  const { out, settle, inOut, markReveal } = window.kit.motion;
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const rgba = (h, a) => `rgba(${hex(h).join(',')},${a})`;
  const floor = () => 28 * Math.min(W, H) / 1440; // the quick test's size floor
  function setText(font, size, tracking = 0) { g.font = font(size); g.letterSpacing = `${tracking * size}px`; g.textBaseline = 'alphabetic'; g.textAlign = 'left'; }
  const widthOf = (font, size, s, tracking = 0) => { setText(font, size, tracking); return g.measureText(s).width; };
  // words fitted into a box (shrink, then wrap, balanced); accent words (*…*) in their own font
  function fit(text, { base, accent = base, maxWidth, maxLines = 2, maxSize, minSize = floor(), lineHeight = 1.1, tracking = 0, accentScale = 1 }) {
    g.letterSpacing = '0px';
    return fitText(g, { text, fontFor: (s, em) => (em ? accent(s * accentScale) : base(s)), maxWidth, maxLines, maxSize, minSize, lineHeight, tracking, balance: true });
  }
  // a headline in the reference's shape: the plain phrase on one line, the accent phrase under it,
  // both at one size; anything else (no accent, or one too long) fits as usual, wrapped and balanced
  function headFit(text, o) {
    const words = window.kit.parseEmphasis(text), i = words.findIndex((w) => w.em);
    if (i > 0 && words.slice(i).every((w) => w.em)) {
      const one = (part) => fit(part, { ...o, maxLines: 1 });
      const a = one(words.slice(0, i)), b = one(words.slice(i)), size = Math.min(a.size, b.size);
      if (size >= o.maxSize * 0.62) {
        const A2 = fit(words.slice(0, i), { ...o, maxLines: 1, maxSize: size }), B2 = fit(words.slice(i), { ...o, maxLines: 1, maxSize: size });
        const lineHeight = size * (o.lineHeight || 1.1), lines = [...A2.lines, ...B2.lines];
        return { size, lines, lineHeight, height: lines.length * lineHeight, width: Math.max(...lines.map((l) => l.width)) };
      }
    }
    return fit(text, { ...o, maxLines: 3 });
  }
  // draw fitted lines; align 'center' around x or 'left' from x; baseline of the first line at y.
  // reveal(j) returns { dy, alpha, clip } for line j, for lines that rise out of a mask
  function drawFit(L, x, y, { base, accent = base, colour, accentColour = colour, align = 'center', tracking = 0, accentScale = 1, reveal } = {}) {
    L.lines.forEach((line, j) => {
      const by = y + j * L.lineHeight, x0 = align === 'center' ? x - line.width / 2 : x;
      const r = reveal ? reveal(j) : { dy: 0, alpha: 1 };
      if (r.alpha <= 0) return;
      g.save();
      if (r.clip) { g.beginPath(); g.rect(0, by - L.size * 1.05, W, L.size * 1.45); g.clip(); }
      g.globalAlpha *= r.alpha;
      for (const w of line.words) {
        const s = w.em ? L.size * accentScale : L.size;
        setText(w.em ? accent : base, s, tracking); g.fillStyle = w.em ? accentColour : colour;
        g.fillText(w.text, x0 + w.x, by + r.dy);
      }
      g.restore();
    });
  }
  // a line that rises out of its mask at t0 and rolls up into it at t1
  const roll = (t, t0, t1, lh) => (j) => {
    const a = out((t - t0 - j * 2 * F) / 0.38), b = out((t - t1 - j * F) / 0.24);
    return { dy: (1 - a) * lh * 1.05 - b * lh * 1.05, alpha: a * (1 - b), clip: true };
  };

  // the app's capture, drawn into a box at the app's own proportions (390 × 844 pt)
  function drawScreen(name, box, alpha = 1) {
    if (alpha <= 0) return;
    g.save(); g.globalAlpha *= alpha; g.imageSmoothingQuality = 'high';
    g.drawImage(IMG(name), box.x, box.y, box.w, box.h); g.restore();
  }
  function drawShot(shot, box) { if (shot.prev && shot.a < 1) drawScreen(shot.prev, box); drawScreen(shot.name, box, shot.a); }

  // ======================================================================================
  // THE STORE CUT: only the app, full frame, with touch hotspots, captions and dissolves
  // ======================================================================================
  // the app fills the frame: 390 × 844 pt at 2.27× (downscaled from the 3× capture, never enlarged)
  function storeBox() { const k = Math.max(W / 390, H / 844); return { x: (W - 390 * k) / 2, y: (H - 844 * k) / 2, w: 390 * k, h: 844 * k, k }; }
  const toStore = (b, [x, y]) => [b.x + x * b.k, b.y + y * b.k];

  // A long name is revealed by a mask that runs ahead of its slide: this context keeps the name's
  // ink at `ink` (0 until its leading edge is inside the 7% margin) and passes everything else on.
  const nameInk = (ink) => ink >= 1 ? g : new Proxy(g, {
    get(c, key) { if (key === 'fillText') return (text, ...rest) => { c.save(); if (text === V.name) c.globalAlpha *= ink; c.fillText(text, ...rest); c.restore(); };
      const value = c[key]; return typeof value === 'function' ? value.bind(c) : value; },
    set(c, key, value) { c[key] = value; return true; },
  });
  // the store's screen as the social cut's phone: full frame, the app's own scale
  const storePhone = () => { const b = storeBox(); return { x: b.x, y: b.y, w: b.w, h: b.h, k: b.k, alpha: 1 }; };
  // the screen at t for the pill's glass and the paid-feature label: what is arriving, and from what
  function seqShot(t, SEQ) {
    let i = 0; for (let k = 0; k < SEQ.length; k++) if (t >= SEQ[k][0]) i = k;
    const [t0, name, kind, extra] = SEQ[i], prev = i > 0 ? SEQ[i - 1][1] : null;
    const a = kind === 'fade' ? inOut((t - t0) / extra) : kind === 'push' || kind === 'sheet' ? glide(t, t0) : kind === 'water' ? clamp((t - t0) / LAND) : 1;
    return { name, prev, a };
  }
  function storeTouches(t, P) {
    for (const [hit, state, rect, idx, fx, fy] of TAPS_S) {
      if (t < hit - 0.45 || t > hit + 0.55) continue;
      const [x, y] = inPhone(P, pointIn(state, rect, idx, fx, fy));
      tallTouch(t, hit, x, y);
    }
    const t0 = TS.swipe, t1 = TS.swipe + 10 / 30;
    if (t > t0 - 0.45 && t < t1 + 0.55) {
      const [x, ya] = inPhone(P, [214, 640]), [, yb] = inPhone(P, [214, 503]);
      tallTouch(t, t0, x, t < t0 ? ya : t < t1 ? lerp(ya, yb, (t - t0) / (t1 - t0)) : yb);
    }
  }

  // the caption pill, docked over the tab bar: [from, to, field, needs the subscription]
  const PILL = [[M.water, M.add, 'cap1'], [M.add, M.rescue, 'cap2'], [M.rescue, M.light, 'cap3', true], [M.light, M.payoff, 'cap4', true], [M.payoff, M.end, 'cap5']];
  const PILL_IN = 1.7, PILL_OUT = M.end; // the pill rises as the opening frost clears, and sinks into the end frame
  function pillText(text) {
    const pad = 0.06 * W;
    return fit(text, { base: SERIF(480), accent: SERIF(360), maxWidth: W * 0.94 - 2 * pad, maxLines: 2, maxSize: 0.062 * W, minSize: Math.max(floor(), 0.032 * W), lineHeight: 1.12, tracking: -0.015 });
  }
  function pillGeom(L) {
    const padY = 0.042 * W, h = L.height + 2 * padY - L.lineHeight * 0.12, w = W * 0.94;
    return { x: (W - w) / 2, y: H * 0.986 - h, w, h, r: 22 * (W / 390), padY };
  }
  function drawPill(t, shot, b) {
    if (t < PILL_IN || t > PILL_OUT + 0.4) return;
    let i = 0; for (let k = 0; k < PILL.length; k++) if (t >= PILL[k][0] - 0.05) i = k;
    const cur = PILL[i], L = pillText(V[cur[2]]);
    // the pill's height follows its words with a quint-out settle
    const prevL = i > 0 ? pillText(V[PILL[i - 1][2]]) : L, s = i > 0 ? out((t - (cur[0] - 0.05)) / 0.3) : 1;
    const G = pillGeom(L), G0 = pillGeom(prevL), h = lerp(G0.h, G.h, s);
    const rise = t < PILL_OUT ? out((t - PILL_IN) / 0.45) : 1 - out((t - PILL_OUT) / 0.35);
    const y = H * 0.986 - h + (1 - rise) * (h + H * 0.04);
    if (rise <= 0) return;
    g.save();
    // soft shadow, then the glass: the screen under it, blurred, and a cream wash
    g.shadowColor = 'rgba(40,55,35,0.18)'; g.shadowBlur = 0.05 * W; g.shadowOffsetY = 0.008 * W;
    roundRect(g, G.x, y, G.w, h, G.r); g.fillStyle = rgba(CREAM, 0.9 * rise); g.fill(); g.shadowColor = 'transparent';
    roundRect(g, G.x, y, G.w, h, G.r); g.clip();
    g.globalAlpha = rise; g.filter = 'blur(20px)'; drawShot(shot, b); g.filter = 'none';
    g.fillStyle = rgba(CREAM, 0.8); g.fillRect(G.x, y, G.w, h);
    g.restore();
    g.save(); g.globalAlpha = rise; roundRect(g, G.x + 0.5, y + 0.5, G.w - 1, h - 1, G.r); g.lineWidth = 1.5; g.strokeStyle = 'rgba(112,108,96,0.22)'; g.stroke(); g.restore();
    // the words: the old caption sinks as the new one rises
    const words = (k, alpha, dy) => {
      const Lk = pillText(V[PILL[k][2]]), Gk = pillGeom(Lk);
      const top = y + (h - Lk.height) / 2 + Lk.size * 0.86;
      g.save(); g.globalAlpha = alpha * rise; g.beginPath(); g.rect(G.x, y, G.w, h); g.clip();
      drawFit(Lk, W / 2, top + dy, { base: SERIF(480), accent: SERIF(360), colour: MOSS_DEEP, accentColour: MOSS, tracking: -0.015 });
      g.restore();
      return Gk;
    };
    // Sequential fades keep two captions from double-exposing. The glass resizes on out5.
    const dt = t - (cur[0] - 0.05), oldA = 1 - out(dt / 0.12), newA = out((dt - 0.12) / 0.22);
    if (i > 0 && oldA > 0) words(i - 1, oldA, 0);
    words(i, i > 0 ? newA : 1, 0);
    // Follow the paid footage itself, including the first/last dissolve frame;
    // caption timing must never leave a visible subscription feature unlabelled.
    const paid = (name) => name?.startsWith('rescue-') || name?.startsWith('light-');
    const plusA = paid(shot.name) ? (shot.prev && !paid(shot.prev) ? shot.a : 1) : paid(shot.prev) ? 1 - shot.a : 0;
    if (plusA > 0) drawPlusTag(W / 2, y, plusA * rise);
  }
  function drawPlusTag(cx, cy, alpha) {
    const s = Math.max(floor(), 0.03 * W), tw = widthOf(SANS(800), s, V.plus.toUpperCase(), 0.08), padX = s * 0.95, h = s * 1.95, w = tw + 2 * padX + s * 1.1;
    g.save(); g.globalAlpha = alpha;
    g.shadowColor = 'rgba(40,55,35,0.16)'; g.shadowBlur = s * 0.6; g.shadowOffsetY = s * 0.12;
    roundRect(g, cx - w / 2, cy - h / 2, w, h, h / 2); g.fillStyle = '#FFF7E0'; g.fill(); g.shadowColor = 'transparent';
    g.lineWidth = 1.5; g.strokeStyle = rgba(SUN, 0.9); g.stroke();
    // the app's sun icon, then the name
    const ix = cx - w / 2 + padX + s * 0.4, iy = cy;
    g.strokeStyle = '#B8871C'; g.lineWidth = s * 0.09; g.lineCap = 'round';
    g.beginPath(); g.arc(ix, iy, s * 0.17, 0, Math.PI * 2); g.stroke();
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; g.beginPath(); g.moveTo(ix + Math.cos(a) * s * 0.29, iy + Math.sin(a) * s * 0.29); g.lineTo(ix + Math.cos(a) * s * 0.38, iy + Math.sin(a) * s * 0.38); g.stroke(); }
    setText(SANS(800), s, 0.08); g.fillStyle = '#7A5A12';
    g.fillText(V.plus.toUpperCase(), ix + s * 0.7, cy + s * 0.36);
    g.restore();
  }

  // the opening title over the frosted app: the mark and the app's own line
  function storeTitle(t) {
    if (t > 2.3) return;
    const leave = out((t - 1.55) / 0.5), a = 1 - leave;
    if (a <= 0) return;
    const L = fit(V.line, { base: SERIF(480), maxWidth: W * 0.8, maxLines: 3, maxSize: 0.094 * W, lineHeight: 1.1, tracking: -0.02 });
    const markS = 0.13 * W, top = H * 0.42 - (L.height + markS + 0.05 * W) / 2;
    g.save(); g.globalAlpha = a; g.translate(0, -leave * 0.03 * H);
    g.globalAlpha *= inOut((t - 0.17) / 0.25); // visible only once it has grown past a dot
    markReveal(g, { t, at: 0.05, cx: W / 2, cy: top + markS / 2, size: markS,
      shape: 'none', bg: { from: MOSS, to: MOSS }, fg: MOSS,
      drawMark: (ctx, { size }) => ctx.drawImage(A.img['assets/brand/mark.svg'], -size / 2, -size / 2, size, size) });
    // the words land one after another, a step apart
    let n = 0;
    L.lines.forEach((line, j) => {
      const by = top + markS + 0.05 * W + L.size * 0.86 + j * L.lineHeight, x0 = W / 2 - line.width / 2;
      for (const w of line.words) {
        const p = out((t - 0.25 - n * F) / 0.35); n++;
        if (p <= 0) continue;
        g.save(); g.globalAlpha *= p; setText(SERIF(480), L.size, -0.02); g.fillStyle = MOSS_DEEP;
        g.fillText(w.text, x0 + w.x, by + (1 - p) * L.size * 0.25); g.restore();
      }
    });
    g.restore();
  }
  // the end frame: the last screen frosts; the mark, the name, the tagline, the disclosure
  function storeEnd(t) {
    if (t < M.end) return;
    const t0 = M.end;
    const markS = 0.12 * W, nameS = Math.min(0.094 * W, W * 0.8 / widthOf(SERIF(520), 100, V.name, -0.02) * 100);
    const T = fit(V.tagline, { base: SERIF(480), accent: SERIF(360), maxWidth: W * 0.84, maxLines: 2, maxSize: 0.066 * W, lineHeight: 1.12, tracking: -0.015 });
    const D = fit(V.disclosure, { base: SANS(600), maxWidth: W * 0.8, maxLines: 3, maxSize: 0.042 * W, minSize: Math.max(floor(), 0.036 * W), lineHeight: 1.3 });
    const block = markS + 0.045 * W + nameS * 0.75 + 0.05 * W + T.height;
    const top = H * 0.43 - block / 2;
    const pop = (k) => { const p = out((t - t0 - k * 0.04) / 0.25); return { a: p, dy: (1 - p) * 0.02 * H }; };
    g.letterSpacing = '0px';
    const lockS = Math.min(nameS, (W * 0.78 - markS - W * 0.025) / widthOf(SERIF(520), 100, V.name) * 100);
    const lockAt = M.end + 0.55, nameW = widthOf(SERIF(520), lockS, V.name), gapL = W * 0.025;
    const right = W / 2 + markS / 2 + gapL + nameW - (gapL + nameW) / 2 * settle(t - lockAt, 0.5);
    g.save(); g.globalAlpha *= inOut((t - t0 - 0.12) / 0.25); // visible only once it has grown past a dot
    markReveal(nameInk(clamp((W * 0.93 - right) / (W * 0.01))), { t, at: t0, cx: W / 2, cy: top + markS / 2, size: markS,
      shape: 'none', bg: { from: MOSS, to: MOSS }, fg: MOSS_DEEP,
      drawMark: (ctx, { size }) => ctx.drawImage(A.img['assets/brand/mark.svg'], -size / 2, -size / 2, size, size),
