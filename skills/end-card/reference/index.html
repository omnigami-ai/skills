<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamplit · End card · Fictional company example</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1220; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="kit.js"></script>
<script>
// A shot cut from product-film: its ask. The mark is born, slides aside for the name; then the
// address, the one action (a line to type, or the product's own button) and a tagline land on
// the beat, and everything holds to the last frame. 4 s (two bars at 120 BPM), 60 fps, in wide,
// square and tall. The reference is the product film's ask for Lamplit, a fictional developer
// tool made for omnigami's examples: its flame, "lamplit", lamplit.example and its install line.
//
//   KEEP    the grid, the type (slam, line, arrive), the mark's spring and slide, the layout
//   ADAPT   the words, the colours, the mark (an SVG path or an image, or the pill), the action's style
(() => {
  const { clamp, lerp, spring, loadFont, loadImage, roundRect, luminance, motion: M } = window.kit;
  const FPS = 60, F = 1 / 12, BPM = 120, BEAT = 60 / BPM, BAR = 4 * BEAT, DURATION = 2 * BAR;
  const at = (bar, beat = 0) => bar * BAR + beat * BEAT; // a time on the beat grid
  const SHAPES = { '16:9': [1920, 1080], '1:1': [1440, 1440], '9:16': [1080, 1920] };
  let W = 1920, H = 1080, U = 10.8; // U: 1% of the frame's short side

  const canvas = document.getElementById('c');
  const g = canvas.getContext('2d', { willReadFrequently: true });

  // ADAPT: the product's colours. Its ground and text (Lamplit is dark first); the accent is its
  // brand colour (Lamplit's amber): words as they arrive, and the button if the action is one.
  // ROW: the panel a line to type sits on (the product's own panel colour).
  const PAPER = '#0E1220', INK = '#ECEAE3', ACCENT = '#FFB23F', MUTED = '#8D93A8', ROW = '#151A2B', ROW_LINE = '#2A3150';
  const onColour = (bg) => (luminance(bg) > 0.4 ? '#0b0b0b' : '#ffffff'); // legible words on a fill
  const SANS = (w) => (s) => `${w} ${s}px "Instrument Sans"`;
  const MONO = (w) => (s) => `${w} ${s}px "JetBrains Mono"`;

  // ---------- ADAPT: the words, as named fields ----------
  // actionStyle: 'command' sets the action as a line to type (mono on an ink row, as the site
  // shows it); 'button' as the product's own button (its words on the accent).
  const DEFAULTS = {
    name: 'lamplit', url: 'lamplit.example', action: 'npm i lamplit', tagline: 'Free for 10k runs a month.',
    actionStyle: 'command',
  };
  const FIELDS = [
    { id: 'name', type: 'text', label: 'Name', maxLength: 18, help: 'The product’s name, beside its mark.' },
    { id: 'url', type: 'text', label: 'Address', maxLength: 28 },
    { id: 'action', type: 'text', label: 'Action', maxLength: 56, help: 'The one thing to do: a line to type, a sign-up, a download.' },
    { id: 'tagline', type: 'text', label: 'Tagline', maxLength: 40 },
  ];
  let V = DEFAULTS; // set from seek's arguments on every frame

  // ---------- ADAPT: the mark ----------
  // null keeps a placeholder pill, in the accent. Or the product's own,
  // in film/assets/: an SVG path filled with the accent, { path: 'M…', box: [width, height] } (the
  // path's own viewBox; add rule: 'evenodd' if the SVG says fill-rule="evenodd"), or an image,
  // { src: 'assets/mark.svg', aspect: width / height }.
  // height (optional): its height as a share of the name's capital height; the pill's is 0.82, and
  // a square or round mark usually wants about 1.2.
  const MARK = { src: 'assets/brand/mark.svg', aspect: 1, height: 1.35 }; // Lamplit's flame
  const A = { mark: null };
  const markAspect = () => (!MARK ? 2 : MARK.path ? MARK.box[0] / MARK.box[1] : MARK.aspect || (A.mark && A.mark.naturalWidth / A.mark.naturalHeight) || 1);
  const markSize = (capH) => { const h = capH * ((MARK && MARK.height) || 0.82); return [h * markAspect(), h]; };
  // the mark, w × h, centred on (x, y)
  function drawMark(c, x, y, w, h) {
    c.save(); c.translate(x - w / 2, y - h / 2);
    if (!MARK) { roundRect(c, 0, 0, w, h, h / 2); c.fillStyle = ACCENT; c.fill(); }
    else if (MARK.path) { c.scale(w / MARK.box[0], h / MARK.box[1]); c.fillStyle = ACCENT; c.fill(new Path2D(MARK.path), MARK.rule || 'nonzero'); }
    else if (A.mark) c.drawImage(A.mark, 0, 0, w, h);
    c.restore();
  }

  // ---------- KEEP: the toolkit. Type: words slam in and arrive in the accent ----------
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, p) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], clamp(p)))).join(',')})`; };
  const steps = (t, t0) => (t - t0) / F; // time since t0 in steps of 1/12 s, the choreography's unit
  const out3 = (p) => 1 - (1 - clamp(p)) ** 3;
  // new words arrive in the accent and cool to their colour: a quarter second, then settling
  const arrive = (t, t0, colour) => { const d = steps(t, t0); return d < 2.5 ? ACCENT : d < 5 ? mix(ACCENT, colour, (d - 2.5) / 2.5) : colour; };
  function setText(c, font, size, tracking = -0.035) { c.font = font(size); c.letterSpacing = `${tracking * size}px`; c.textBaseline = 'alphabetic'; c.textAlign = 'left'; }
  const widthOf = (c, font, size, s, tracking) => { setText(c, font, size, tracking); return c.measureText(s).width; };
  const capOf = (size) => size * 0.7; // Instrument Sans' cap height
  // the largest size up to `max` at which `s` fits `maxW`
  const fitSize = (font, s, max, maxW, tracking) => Math.min(max, maxW / Math.max(1, widthOf(g, font, 100, s, tracking)) * 100);

  // a word slammed in: from oversized and soft to set in 0.22 s. It grows from its middle, or from
  // its left edge (`fromLeft`) when something sits just to its left, as the mark does beside the name,
  // and never past 3U from the frame's edge.
  function slam(c, s, x, y, font, size, t, t0, colour, tracking, fromLeft = false) {
    const d = steps(t, t0);
    if (d < 0) return;
    setText(c, font, size, tracking);
    const w = c.measureText(s).width, ox = fromLeft ? 0 : w / 2;
    // grown from its left edge, it never passes the frame's margin
    const room = fromLeft ? W - 3 * U - x : 2 * Math.min(x + w / 2 - 3 * U, W - 3 * U - x - w / 2); // it never grows past 3U from the frame's edge
    const e = out3(d / 2.6), k = Math.min(lerp(1.16, 1, e), Math.max(1, room / w));
    const blur = 10 * (1 - e) ** 2, alpha = lerp(0.55, 1, Math.sqrt(e));
    c.save(); c.globalAlpha *= alpha; if (blur > 0.2) c.filter = `blur(${blur * U / 10}px)`;
    c.translate(x + ox, y - capOf(size) / 2); c.scale(k, k);
    c.fillStyle = colour; c.fillText(s, -ox, capOf(size) / 2); c.restore();
  }
  // a line whose words land one after another, a step apart
  function line(c, text, x, y, font, size, t, t0, { colour = INK, stagger = F, align = 'left', tracking } = {}) {
    const words = text.split(' '), space = widthOf(c, font, size, ' ', tracking);
    const widths = words.map((w) => widthOf(c, font, size, w, tracking));
    const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
    let wx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
    words.forEach((w, i) => { slam(c, w, wx, y, font, size, t, t0 + i * stagger, arrive(t, t0 + i * stagger, colour), tracking); wx += widths[i] + space; });
  }

  // ---------- KEEP: the layout: the lockup, then the rows under it ----------
  // Wide and square set the mark beside the name; tall stacks the mark above it, so the name can take
  // the frame's width. Sizes in U: wide sets everything about 1.4× larger (the frame has the width),
  // tall the name up to 22U and the rows 1.4×. A long name shrinks the lockup to fit the width (86%,
  // 90% in tall), and the rows under it with it (to 75% at most), so the name always leads. A short
  // name keeps the mark no wider than 60% of it (or its capital height), so the mark never outweighs it.
  function layout() {
    const tall = H > W, [nameMax, scale] = W > H ? [19.3 * U, 1.44] : tall ? [22 * U, 1.4] : [14 * U, 1.1];
    const fitW = W * (tall ? 0.9 : 0.86);
    const mark = (size, nameW) => { const [w, h] = markSize(capOf(size)), k = Math.min(1, Math.max(0.6 * nameW, capOf(size)) / w); return [w * k, h * k]; };
    const name100 = widthOf(g, SANS(600), 100, V.name, -0.04), at100 = tall ? name100 : mark(100, name100)[0] + 24 + name100;
    const size = Math.min(nameMax, fitW / at100 * 100), nameW = name100 * size / 100;
    // stacked, the mark has its own line, so a long name doesn't shrink it below 60% of its full size
    const markFor = tall ? Math.max(size, nameMax * 0.6) : size, [mw, mh] = mark(markFor, nameW);
    const gap = markFor * (tall ? 0.3 : 0.24); // beside: mark to name; stacked: mark to the name's capitals
    // beside the name the mark centres on its letters: the capitals, or the lowercase if it has none
    const markMid = /[A-Z0-9]/.test(V.name) ? capOf(size) / 2 : size * 0.266;
    const S = scale * U * clamp(size / nameMax, 0.75, 1), G = 4.5 * S; // G: the gap between rows, ink to ink
    // the action: up to 4.2S (a command) or 3.6S (a button, kept smaller than the mark), fitted to the
    // name's width; the tagline never louder than it
    const button = V.actionStyle === 'button', font = button ? SANS(600) : MONO(500), track = button ? -0.01 : 0, padX = (button ? 8 : 3.6) * S;
    const us = fitSize(SANS(600), V.url, Math.min(5.6 * S, size * 0.6), fitW, -0.02);
    const as = fitSize(font, V.action, (button ? 3.6 : 4.2) * S, fitW - padX, track), bh = (button ? 8 : 7) * S;
    const ts = fitSize(SANS(500), V.tagline, Math.min(3.3 * S, size * 0.5, as * 1.1), fitW, -0.01);
    // the rows from the name's baseline down, an even gap between each one's ink and the next (Geist's
    // capitals and ascenders reach 0.71 of the size, its descenders 0.16)
    const urlY = 0.16 * size + G + capOf(us), rowY = urlY + 0.16 * us + G, tagY = rowY + bh + G + capOf(ts);
    const markY = tall ? -capOf(size) - gap - mh / 2 : -markMid; // the mark's centre, from the name's baseline
    const top = Math.min(-capOf(size), markY - mh / 2);
    const cy = H * 0.47 - (top + tagY) / 2; // the block's middle a touch above the frame's
    const x = tall ? W / 2 - nameW / 2 : W / 2 - (mw + gap + nameW) / 2;
    return {
      size, mw, mh, cy, S, us, button, font, track, padX, as, bh, ts, tall,
      mark: tall ? [W / 2, cy + markY] : [x + mw / 2, cy + markY], born: [W / 2, cy - capOf(size) / 2],
      nameX: tall ? x : x + mw + gap, urlY: cy + urlY, rowY: cy + rowY, tagY: cy + tagY,
    };
  }

  // ============================== the shot ==============================
  // Bar 0: a breath of paper, the mark born at step 3 (0.25 s), the name at step 6 (0.5 s); the
  // address on beat 3, the action on beat 4. Bar 1: the tagline on the downbeat, then the hold.
  const T = { mark: 4 * F, name: 6 * F, url: at(0, 2), action: at(0, 3), tagline: at(1) };
  function shot(t) {
    g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
    const L = layout(), cy = L.cy;
    if (t <= T.mark - F) return;
    // the mark: born where the name will be and sliding at once to its place, beside the name or above
    // it, where it has arrived as the name lands (product-film starts the slide a step later, out of
    // the payoff's fold)
    const m = spring(t - T.mark + F, 260, 24), pk = lerp(0.6, 1, M.settle(t - T.mark + F, 0.4)); // born at 60%, never a dot
    const mx = lerp(L.born[0], L.mark[0], m), my = lerp(L.born[1], L.mark[1], m);
    g.save(); g.globalAlpha *= M.inOut((t - T.mark + F) / 0.2); g.translate(mx, my); g.scale(pk, pk); drawMark(g, 0, 0, L.mw, L.mh); g.restore();
    slam(g, V.name, L.nameX, cy, SANS(600), L.size, t, T.name, arrive(t, T.name, INK), -0.04, !L.tall);
    // the address
    line(g, V.url, W / 2, L.urlY, SANS(600), L.us, t, T.url, { colour: INK, align: 'center', tracking: -0.02 });
    // the action: a line to type, mono on an ink row; or the product's button, on the accent
    if (t >= T.action) {
      const tw = widthOf(g, L.font, L.as, V.action, L.track), bw = Math.max(tw + L.padX, 2.5 * L.bh); // a row, never a square key
      const k = lerp(0.9, 1, spring(t - T.action, 320, 20));
      g.save(); g.translate(W / 2, L.rowY + L.bh / 2); g.scale(k, k);
      roundRect(g, -bw / 2, -L.bh / 2, bw, L.bh, 1.6 * L.S); g.fillStyle = L.button ? ACCENT : ROW; g.fill();
      if (!L.button) { g.lineWidth = Math.max(1, 0.15 * U); g.strokeStyle = ROW_LINE; g.stroke(); }
      setText(g, L.font, L.as, L.track); g.fillStyle = L.button ? onColour(ACCENT) : INK; g.fillText(V.action, -tw / 2, capOf(L.as) / 2); g.restore();
    }
    // the tagline, quiet, under it all
    line(g, V.tagline, W / 2, L.tagY, SANS(500), L.ts, t, T.tagline, { colour: MUTED, align: 'center', tracking: -0.01 });
  }

  // ---------- KEEP: drawing, loading; ADAPT: the cues ----------
  function seek(t, values) {
    V = { ...DEFAULTS, ...values };
    [W, H] = SHAPES[V.size] || SHAPES['16:9']; U = Math.min(W, H) / 100;
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    g.reset();
    shot(clamp(t, 0, DURATION - 1e-6));
    return canvas;
  }
  async function prepare() {
    await Promise.all([loadFont('Instrument Sans', 'assets/fonts/instrument-sans-variable.ttf', { weight: '400 700', stretch: '75% 100%' }), loadFont('JetBrains Mono', 'assets/fonts/jetbrains-mono-variable.ttf', { weight: '100 800' })]);
    if (MARK && MARK.src) A.mark = await loadImage(MARK.src);
    await document.fonts.ready;
  }

  // sound, each on its visual onset: a soft pop as the mark is born, as the name, the address and the action land
  function cues() {
    return [{ t: T.mark - F, type: 'pop', gain: 0.42 }, { t: T.name, type: 'pop', gain: 0.4 }, { t: T.url, type: 'pop', gain: 0.38 }, { t: T.action, type: 'pop', gain: 0.42 }];
  }
  // the bed under product-film's ask: the full groove for a bar, then the pad and hats alone
  const music = {
    bpm: BPM, duration: DURATION, root: 50, // D3, upward-voiced major chords
    chords: [[0, 4, 7], [7, 11, 14]],
    sections: [{ from: 0, to: 1, kick: 0.8, hats: 0.6, clap: 0.45, bass: 0.65, pad: 0.55 }, { from: 1, to: 2, pad: 0.75, hats: 0.3 }],
  };
  const long = (n) => 'maximum workflow momentum meaning homework wombat memo warm maximum'.slice(0, n).trimEnd();
  window.template = {
    fps: FPS, duration: DURATION, sizes: SHAPES, width: W, height: H, defaults: () => ({ size: '16:9', ...DEFAULTS }), fields: FIELDS,
    prepare, seek: (t, values) => seek(t, values), cues, music,
    keyTimes: [0.95, 1.45, 1.95, 2.8, 3.95],
    // the quick test also tries the button, with the product-film runs' own words and at a button's longest (24)
    stress: { button: { actionStyle: 'button', action: 'Start free trial' }, buttonLong: { actionStyle: 'button', action: long(24) } },
  };
  const q = new URLSearchParams(location.search);
  if (window.parent === window && !q.has('render')) prepare().then(() => { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION, { size: q.get('size') || '16:9' }); requestAnimationFrame(loop); }; loop(); });
})();
</script>
