# Generated from omnigami-ai/skills provenance/provenance.yml; do not edit per skill.
name: Signed release archive
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  rebuild-and-attest:
    if: github.repository_owner == 'omnigami-ai' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - name: Fetch pinned recipe and approved candidate
        env:
          PACKAGER_REVISION: '@PACKAGER_REVISION@'
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          from pathlib import Path
          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'omnigami-release-verifier/1.0'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()
          slug = os.environ['GITHUB_REPOSITORY'].split('/')[1]
          version = os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', version):
              raise SystemExit('Expected a release tag')
          tag = 'provenance/' + slug + '/' + version
          # Git transport avoids the anonymous REST quota shared by hosted runners.
          ref = subprocess.check_output(['git', 'ls-remote', 'https://github.com/omnigami-ai/skills.git', 'refs/tags/' + tag], text=True).strip()
          if not re.fullmatch(r'[0-9a-f]{40}\s+refs/tags/' + re.escape(tag), ref):
              raise SystemExit('Expected one lightweight approved-candidate tag')
          revision = ref.split()[0]
          base = 'https://raw.githubusercontent.com/omnigami-ai/skills/'
          Path('candidate.json').write_bytes(fetch(base + revision + '/releases/' + slug + '/' + version + '.json'))
          Path('skill-index.json').write_bytes(fetch(base + revision + '/releases/skill-index.json'))
          for name in ('archive.py', 'rebuild.py', 'test_archive.py'):
              Path(name).write_bytes(fetch(base + os.environ['PACKAGER_REVISION'] + '/provenance/' + name))
          Path('candidate-revision.txt').write_text(revision + '\n')
          PY
      - name: Rebuild and require approved index and published archive equality
        run: python3 test_archive.py && python3 rebuild.py
      - name: Attest rebuilt bytes
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/provenance/*.tar.gz
          create-storage-record: false
      - name: Verify exact tagged source and signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify out/provenance/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/provenance.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners
      - name: Collect small verification evidence
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" out/provenance/attestation.sigstore.json
          cp candidate.json candidate-revision.txt out/provenance/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: |
            out/provenance/*.json
            out/provenance/*.txt
          retention-days: 7
          if-no-files-found: error
